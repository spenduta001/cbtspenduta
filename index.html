    /* =========================================================================
       1. CRYPTOGRAPHY & UTILITIES (SHA-256 + FALLBACK)
       ========================================================================= */
    async function hashPassword(plainText) {
      try {
        if (window.crypto && window.crypto.subtle) {
          const encoder = new TextEncoder();
          const data = encoder.encode(plainText);
          const hashBuffer = await crypto.subtle.digest('SHA-256', data);
          const hashArray = Array.from(new Uint8Array(hashBuffer));
          return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }
      } catch (e) {}
      return sha256Fallback(plainText);
    }

    function sha256Fallback(ascii) {
      function rightRotate(value, amount) { return (value >>> amount) | (value << (32 - amount)); }
      var mathPow = Math.pow, maxWord = mathPow(2, 32), lengthProperty = 'length';
      var i, j, result = '', words = [], asciiBitLength = ascii[lengthProperty] * 8;
      var hash = sha256Fallback.h = sha256Fallback.h || [];
      var k = sha256Fallback.k = sha256Fallback.k || [];
      var primeCounter = k[lengthProperty];
      var isComposite = {};
      for (var candidate = 2; primeCounter < 64; candidate++) {
        if (!isComposite[candidate]) {
          for (i = 0; i < 313; i += candidate) isComposite[i] = candidate;
          hash[primeCounter] = (mathPow(candidate, .5) * maxWord) | 0;
          k[primeCounter++] = (mathPow(candidate, 1 / 3) * maxWord) | 0;
        }
      }
      ascii += '\x80';
      while (ascii[lengthProperty] % 64 - 56) ascii += '\x00';
      for (i = 0; i < ascii[lengthProperty]; i++) {
        j = ascii.charCodeAt(i);
        if (j >> 8) return '';
        words[i >> 2] |= j << ((3 - i) % 4) * 8;
      }
      words[words[lengthProperty]] = ((asciiBitLength / maxWord) | 0);
      words[words[lengthProperty]] = (asciiBitLength);
      for (j = 0; j < words[lengthProperty];) {
        var w = words.slice(j, j += 16), oldHash = hash;
        hash = hash.slice(0, 8);
        for (i = 0; i < 64; i++) {
          var w15 = w[i - 15], w2 = w[i - 2];
          var a = hash[0], e = hash[4];
          var temp1 = hash[7] + (rightRotate(e, 6) ^ rightRotate(e, 11) ^ rightRotate(e, 25)) +
            ((e & hash[5]) ^ ((~e) & hash[6])) + k[i] + (w[i] = (i < 16) ? w[i] : (
              w[i - 16] + (rightRotate(w15, 7) ^ rightRotate(w15, 18) ^ (w15 >>> 3)) +
              w[i - 7] + (rightRotate(w2, 17) ^ rightRotate(w2, 19) ^ (w2 >>> 10))
            ) | 0);
          var temp2 = (rightRotate(a, 2) ^ rightRotate(a, 13) ^ rightRotate(a, 22)) +
            ((a & hash[1]) ^ (a & hash[2]) ^ (hash[1] & hash[2]));
          hash = [(temp1 + temp2) | 0].concat(hash);
          hash[4] = (hash[4] + temp1) | 0;
        }
        for (i = 0; i < 8; i++) hash[i] = (hash[i] + oldHash[i]) | 0;
      }
      for (i = 0; i < 8; i++) {
        for (j = 3; j + 1; j--) {
          var b = (hash[i] >> (j * 8)) & 255;
          result += ((b < 16) ? 0 : '') + b.toString(16);
        }
      }
      return result;
    }

    function generateId(prefix = 'ID') {

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function formatDateTime(isoStr) {
      if (!isoStr) return '-';
      const d = new Date(isoStr);
      if (isNaN(d.getTime())) return isoStr;
      return d.toLocaleString('id-ID', {
        day: '2-digit', month: 'short', year: 'numeric',
        hour: '2-digit', minute: '2-digit', second: '2-digit'
      });
    }

    function getTodayDateString() {
      const now = new Date();
      const y = now.getFullYear();
      const m = String(now.getMonth() + 1).padStart(2, '0');
      const d = String(now.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function normalizeSheetDateStr(val, fallback = '') {
      if (!val) return fallback || getTodayDateString();
      const s = String(val).trim();
      if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
      if (/^\d{4}-\d{2}-\d{2}T/.test(s)) {
        const dt = new Date(s);
        if (!isNaN(dt.getTime())) {
          return `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}-${String(dt.getDate()).padStart(2, '0')}`;
        }
        return s.slice(0, 10);
      }
      const dmy = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
      if (dmy) {
        return `${dmy[3]}-${dmy[2].padStart(2, '0')}-${dmy[1].padStart(2, '0')}`;
      }
      return fallback || getTodayDateString();
    }

    function normalizeSheetTimeStr(val, fallback = '07:30') {
      if (!val) return fallback;
      const s = String(val).trim();
      const hhmm = s.match(/^(\d{1,2}):(\d{2})(?::\d{2})?$/);
      if (hhmm) {
        return `${hhmm[1].padStart(2, '0')}:${hhmm[2].padStart(2, '0')}`;
      }
      if (s.includes('T')) {
        const dt = new Date(s);
        if (!isNaN(dt.getTime())) {
          return `${String(dt.getHours()).padStart(2, '0')}:${String(dt.getMinutes()).padStart(2, '0')}`;
        }
      }
      return fallback;
    }

    function parseLocalDateTime(dateStr, timeStr, secondPart = '00') {
      const cleanDate = normalizeSheetDateStr(dateStr, getTodayDateString());
      const cleanTime = normalizeSheetTimeStr(timeStr, '00:00');
      const [y, m, d] = cleanDate.split('-').map(Number);
      const [hh, mm] = cleanTime.split(':').map(Number);
      return new Date(y, (m || 1) - 1, d || 1, hh || 0, mm || 0, Number(secondPart) || 0);
    }

    function formatTimer(seconds) {
      const s = Math.max(0, Math.floor(seconds));
      const h = Math.floor(s / 3600);
      const m = Math.floor((s % 3600) / 60);
      const sec = s % 60;
      if (h > 0) return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
      return `${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
    }

    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;

    function copyTextToClipboard(text) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.left = '-9999px';
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand('copy');
        showToast('Berhasil disalin ke clipboard!', 'success');
      } catch (e) {
        showToast('Gagal menyalin teks.', 'error');
      }
      document.body.removeChild(ta);

      const colors = {

        warning: 'fa-triangle-exclamation',
        info: 'fa-circle-info'

      setTimeout(() => {
        el.style.opacity = '0';
        el.style.transform = 'translateX(24px)';
        setTimeout(() => el.remove(), 300);
      }, 3600);
    }

    async function waitForCloudSdk(maxWaitMs = 4000) {
      const start = Date.now();
      while (!window._CloudSDK && (Date.now() - start) < maxWaitMs) {
        await new Promise(r => setTimeout(r, 80));
      }
      return Boolean(window._CloudSDK);
    }

    async function initCloudDatabase() {
      try {
        const sdkReady = await waitForCloudSdk();
        if (!sdkReady || typeof __firebase_config === 'undefined') {
          cloudConnected = false;
          return false;
        }
        const firebaseConfig = typeof __firebase_config === 'string' ? JSON.parse(__firebase_config) : __firebase_config;
        cloudAppId = typeof __app_id !== 'undefined' ? String(__app_id) : 'ujian-sekolah-digital-default';
        const { initializeApp, getAuth, signInAnonymously, signInWithCustomToken, getFirestore } = window._CloudSDK;

        cloudApp = initializeApp(firebaseConfig);
        cloudAuth = getAuth(cloudApp);
        cloudDb = getFirestore(cloudApp);

        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
          const cred = await signInWithCustomToken(cloudAuth, __initial_auth_token);
          cloudUser = cred.user;
        } else {
          const cred = await signInAnonymously(cloudAuth);
          cloudUser = cred.user;
        }
        cloudConnected = Boolean(cloudUser && cloudDb);
        return cloudConnected;
      } catch (err) {
        console.warn('Cloud initialization fallback to session mode:', err);
        cloudConnected = false;
        return false;
      }
    }

    async function pushDatabaseToCloudNow() {
      if (!cloudConnected || !cloudUser || !cloudDb || !window._CloudSDK || isApplyingCloudSnapshot) return;
      try {
        const { doc, setDoc } = window._CloudSDK;
        const revision = new Date().toISOString();
        lastCloudRevision = revision;
        const payload = JSON.parse(JSON.stringify({
          settings: DB.settings,
          users: DB.users,
          kelas: DB.kelas,
          mapel: DB.mapel,
          bankSoal: DB.bankSoal,
          jadwal: DB.jadwal,
          liveSessions: DB.liveSessions,
          hasilUjian: DB.hasilUjian,
          logAktivitas: DB.logAktivitas,
          beritaAcara: DB.beritaAcara,
          _updatedAt: revision,
          _updatedBy: cloudUser.uid
        }));
        const stateDocRef = doc(cloudDb, 'artifacts', cloudAppId, 'public', 'data', 'cbt_state', 'master');
        await setDoc(stateDocRef, payload);
      } catch (err) {
        console.error('Gagal menyimpan snapshot ke cloud:', err);
      }
    }

    async function loadDatabase() {
      DB = await createDefaultDatabase();

      // 1. Muat cache lokal terlebih dahulu agar instan & tahan refresh
      try {
        const cachedRaw = localStorage.getItem(LOCAL_DB_KEY);
        if (cachedRaw) {
          const cached = JSON.parse(cachedRaw);
          if (cached && Array.isArray(cached.users) && cached.users.length > 0) {
            DB = {
              ...DB,
              ...cached,
              settings: Object.assign({}, DB.settings, cached.settings || {})
            };
          }
        }
      } catch (e) {}

      // 2. Dukung parameter URL otomatis (?gas=... atau ?portal=siswa / ?portal=staf)
      try {
        const urlParams = new URLSearchParams(window.location.search);
        const paramGas = urlParams.get('gas');
        const paramRole = urlParams.get('portal');
        if (paramGas && paramGas.includes('script.google.com')) {
          DB.settings.gasUrl = decodeURIComponent(paramGas).trim();
        }
        if (EMBEDDED_WEB_APP_CONFIG.gasWebAppUrl && !DB.settings.gasUrl) {
          DB.settings.gasUrl = EMBEDDED_WEB_APP_CONFIG.gasWebAppUrl.trim();
        }
        if (paramRole === 'staf' || paramRole === 'guru') {
          loginPortalTab = 'staf';
        } else if (paramRole === 'siswa') {
          loginPortalTab = 'siswa';
        }
      } catch (e) {}

      // Simpan state terbaru ke localStorage
      try { localStorage.setItem(LOCAL_DB_KEY, JSON.stringify(DB)); } catch (e) {}

      await initCloudDatabase();

      if (cloudConnected && cloudUser && cloudDb && window._CloudSDK) {
        const { doc, setDoc, onSnapshot } = window._CloudSDK;
        const stateDocRef = doc(cloudDb, 'artifacts', cloudAppId, 'public', 'data', 'cbt_state', 'master');

        await new Promise((resolve) => {
          let initialResolved = false;
          cloudUnsubscribe = onSnapshot(stateDocRef, async (snap) => {
            if (snap.exists()) {
              const remote = snap.data();
              if (EMBEDDED_WEB_APP_CONFIG.gasWebAppUrl && (!remote.settings || !remote.settings.gasUrl)) {
                remote.settings = Object.assign({}, remote.settings, { gasUrl: EMBEDDED_WEB_APP_CONFIG.gasWebAppUrl });
              }
              applyCloudSnapshotData(remote);
              try { localStorage.setItem(LOCAL_DB_KEY, JSON.stringify(DB)); } catch (e) {}
            } else {
              const seedPayload = {
                ...DB,
                _updatedAt: new Date().toISOString(),
                _updatedBy: cloudUser.uid
              };
              lastCloudRevision = seedPayload._updatedAt;
              await setDoc(stateDocRef, seedPayload);
            }
            if (!initialResolved) {
              initialResolved = true;
              resolve();
            }
          }, (error) => {
            console.error('Error sinkronisasi real-time:', error);
            cloudConnected = false;
            if (!initialResolved) {
              initialResolved = true;
              resolve();
            }
          });
        });
      }

      // 3. Auto-Pull segera & aktifkan Auto-Polling berkala dari Google Sheets Web App
      if (DB.settings.gasUrl && DB.settings.autoPullOnLoad !== false && navigator.onLine) {
        await syncPullFromGoogleSheets(true);
      }
      startGasAutoSyncPolling();
    }

    function startGasAutoSyncPolling() {
      if (gasAutoPollInterval) clearInterval(gasAutoPollInterval);
      const sec = Math.max(8, Number(EMBEDDED_WEB_APP_CONFIG.autoPollSeconds) || 12);
      gasAutoPollInterval = setInterval(() => {
        if (!DB?.settings?.gasUrl || DB.settings.autoPullOnLoad === false) return;
        if (!navigator.onLine || isPullingFromGas || isPushingToGas) return;
        // Jika ada antrean lokal tertunda, kirim dulu baru tarik pembaruan
        if (getSyncQueue().length > 0) {
          syncPushToGoogleSheets(true);
        } else {
          syncPullFromGoogleSheets(true);
        }
      }, sec * 1000);
    }

    function saveDatabase(enqueueSync = true) {
      // 1. Simpan ke localStorage segera
      try {
        localStorage.setItem(LOCAL_DB_KEY, JSON.stringify(DB));
      } catch (e) {}

      // 2. Sinkronkan ke Cloud Real-Time
      if (cloudConnected && !isApplyingCloudSnapshot) {
        if (cloudSyncDebounce) clearTimeout(cloudSyncDebounce);
        cloudSyncDebounce = setTimeout(() => {
          pushDatabaseToCloudNow();
        }, 250);
      }

      // 3. Sinkronkan otomatis ke Google Sheets Web App
      if (enqueueSync && DB?.settings?.gasUrl) {
        enqueueOfflineSync({ type: 'FULL_SNAPSHOT', timestamp: new Date().toISOString() });
        if (DB.settings.autoSyncSheets !== false && navigator.onLine) {
          scheduleAutoGoogleSheetsPush();
        }
      }
    }

    /* =========================================================================
       4. GOOGLE SHEETS SYNC ENGINE & OFFLINE QUEUE
       ========================================================================= */
    let autoSheetsPushTimer = null;
    function scheduleAutoGoogleSheetsPush() {
      if (autoSheetsPushTimer) clearTimeout(autoSheetsPushTimer);
      autoSheetsPushTimer = setTimeout(() => {
        syncPushToGoogleSheets(true);
      }, 1200);
    }

    function getSyncQueue() {
      return syncQueueMemory;
    }

    function enqueueOfflineSync(payload) {
      syncQueueMemory.push(payload);
      if (syncQueueMemory.length > 50) syncQueueMemory = syncQueueMemory.slice(-50);
      updateOnlineIndicator();
    }

    function getShareablePortalLinks() {
      const gasTrimmed = (DB.settings.gasUrl || '').trim();
      const rawBase = (DB.settings.portalUrl && DB.settings.portalUrl.trim())
        ? DB.settings.portalUrl.trim()
        : (gasTrimmed || (window.location.href.startsWith('http') ? window.location.href.split('?')[0] : ''));
      const gasParam = gasTrimmed && rawBase !== gasTrimmed ? `gas=${encodeURIComponent(gasTrimmed)}` : '';

      const buildUrl = (portalRole) => {
        if (!rawBase) return '';
        const sep = rawBase.includes('?') ? '&' : '?';
        const parts = [`portal=${portalRole}`];
        if (gasParam) parts.push(gasParam);
        return `${rawBase}${sep}${parts.join('&')}`;
      };

      return {
        baseUrl: rawBase,
        siswaUrl: buildUrl('siswa'),
        guruUrl: buildUrl('staf')
      };
    }

      const gasUrl = (document.getElementById('gas-url-input')?.value || DB.settings.gasUrl || '').trim();
      const portalUrl = (document.getElementById('portal-url-input')?.value || DB.settings.portalUrl || '').trim();

      let fullHtml = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
      fullHtml = fullHtml.replace(
        /const EMBEDDED_WEB_APP_CONFIG = \{[\s\S]*?\};/,
        `const EMBEDDED_WEB_APP_CONFIG = {\n      gasWebAppUrl: ${JSON.stringify(gasUrl)},\n      publicPortalUrl: ${JSON.stringify(portalUrl)},\n      autoPullOnLoad: true,\n      autoPushOnSave: true,\n      autoPollSeconds: 12\n    };`
      );

      const blob = new Blob([fullHtml], { type: 'text/html;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'index.html';
      a.click();
      URL.revokeObjectURL(url);
      showToast('File "index.html" (siap GitHub Pages) berhasil diunduh! Upload langsung file index.html ini ke root repository GitHub Anda.', 'success');
    }

    async function syncPushToGoogleSheets(silent = false) {
      if (isPushingToGas) return;
      const gasInput = document.getElementById('gas-url-input');
      if (gasInput && gasInput.value.trim()) {
        DB.settings.gasUrl = gasInput.value.trim();
      }
      const url = DB.settings.gasUrl?.trim();
      if (!url) {
        if (!silent) showToast('Masukkan URL Google Apps Script Web App terlebih dahulu.', 'warning');
        return;
      }
      if (!navigator.onLine) {
        enqueueOfflineSync({ type: 'MANUAL_PUSH', timestamp: new Date().toISOString() });
        if (!silent) showToast('Perangkat offline. Data masuk antrean sinkronisasi otomatis.', 'warning');
        return;
      }
      isPushingToGas = true;
      if (!silent) showToast('Mengirim seluruh data ke Google Sheets...', 'info');
      try {
        const sheetsPayload = buildSixSheetsPayload();
        await fetch(url, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            action: 'syncAll',
            sheets: sheetsPayload,
            liveSessions: DB.liveSessions || []
          })
        });
        DB.settings.lastSync = new Date().toISOString();
        syncQueueMemory = [];
        try { localStorage.setItem(LOCAL_DB_KEY, JSON.stringify(DB)); } catch (e) {}
        updateOnlineIndicator();
        if (!silent) showToast('Sinkronisasi Push ke Google Sheets berhasil!', 'success');
        if (currentRoute === 'sync' && !silent) renderCurrentView();
      } catch (err) {
        enqueueOfflineSync({ type: 'FAILED_PUSH', timestamp: new Date().toISOString() });
        if (!silent) showToast('Gagal terhubung ke GAS URL. Tersimpan di antrean offline.', 'error');
      } finally {
        isPushingToGas = false;
      }
    }

    async function syncPullFromGoogleSheets(silent = false) {
      if (isPullingFromGas) return;
      if (silent && (getSyncQueue().length > 0 || autoSheetsPushTimer)) return;
      const gasInput = document.getElementById('gas-url-input');
      if (gasInput && gasInput.value.trim()) {
        DB.settings.gasUrl = gasInput.value.trim();
      }
      const url = DB.settings.gasUrl?.trim();
      if (!url) {
        if (!silent) showToast('Masukkan URL Google Apps Script Web App terlebih dahulu.', 'warning');
        return;
      }
      if (!navigator.onLine) {
        if (!silent) showToast('Tidak ada koneksi internet untuk menarik data.', 'error');
        return;
      }
      isPullingFromGas = true;
      if (!silent) showToast('Menarik seluruh data terbaru dari Google Sheets...', 'info');
      try {
        const sep = url.includes('?') ? '&' : '?';
        const res = await fetch(`${url}${sep}action=pullAll&_t=${Date.now()}`);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        let importedCount = 0;

        // 0. Pull PENGATURAN_SEKOLAH
        if (data && Array.isArray(data.PENGATURAN_SEKOLAH) && data.PENGATURAN_SEKOLAH[0]) {
          const cfg = data.PENGATURAN_SEKOLAH[0];
          if (cfg.School_Name) DB.settings.schoolName = String(cfg.School_Name);
          if (cfg.NPSN) DB.settings.npsn = String(cfg.NPSN);
          if (cfg.Address) DB.settings.address = String(cfg.Address);
          if (cfg.Headmaster_Name) DB.settings.headmasterName = String(cfg.Headmaster_Name);
          if (cfg.Headmaster_NIP) DB.settings.headmasterNip = String(cfg.Headmaster_NIP);
          if (cfg.Proctor_PIN) DB.settings.proctorPin = String(cfg.Proctor_PIN);
          if (cfg.Default_Room) DB.settings.defaultRoom = String(cfg.Default_Room);
        }

        // 1. Pull DATA_SISWA
        if (data && Array.isArray(data.DATA_SISWA)) {
          const defaultSiswaHash = await hashPassword('siswa123');
          for (const row of data.DATA_SISWA) {
            const nama = String(row.Nama_Siswa || '').trim();
            const username = String(row.Username || '').trim();
            if (!nama || !username) continue;
            const existing = DB.users.find(u => u.id === row.ID_Siswa || u.username.toLowerCase() === username.toLowerCase());
            if (existing) {
              existing.name = nama;
              existing.noPeserta = String(row.No_Peserta || existing.noPeserta || '').trim();
              existing.kelas = String(row.Kelas || existing.kelas || '').trim();
              existing.ruangUjian = String(row.Ruang_Ujian || existing.ruangUjian || DB.settings.defaultRoom).trim();
              if (row.Password_Hash) existing.passwordHash = String(row.Password_Hash).trim();
              existing.status = String(row.Status_Akun || 'Aktif').trim();
            } else {
              DB.users.push({
                id: row.ID_Siswa || generateId('USR-SIS'),
                role: 'siswa',
                name: nama,
                username,
                passwordHash: row.Password_Hash ? String(row.Password_Hash).trim() : defaultSiswaHash,
                noPeserta: String(row.No_Peserta || '').trim(),
                kelas: String(row.Kelas || '').trim(),
                ruangUjian: String(row.Ruang_Ujian || DB.settings.defaultRoom).trim(),
                status: String(row.Status_Akun || 'Aktif').trim()
              });
              importedCount++;
            }
          }
        }

        // 2. Pull DATA_GURU
        if (data && Array.isArray(data.DATA_GURU)) {
          const defaultGuruHash = await hashPassword('guru123');
          for (const row of data.DATA_GURU) {
            const nama = String(row.Nama_Lengkap || row.Nama_Guru || '').trim();
            const username = String(row.Username || '').trim();
            if (!nama || !username) continue;
            const existing = DB.users.find(u => u.id === row.ID_Staf || u.id === row.ID_Guru || u.username.toLowerCase() === username.toLowerCase());
            if (existing) {
              existing.name = nama;
              existing.mapel = String(row.Mata_Pelajaran || existing.mapel || '-').trim();
              if (row.Password_Hash) existing.passwordHash = String(row.Password_Hash).trim();
            } else {
              DB.users.push({
                id: row.ID_Staf || row.ID_Guru || generateId('USR-GRU'),
                role: String(row.Peran || 'guru').toLowerCase() === 'pengawas' ? 'pengawas' : 'guru',
                name: nama,
                username,
                passwordHash: row.Password_Hash ? String(row.Password_Hash).trim() : defaultGuruHash,
                mapel: String(row.Mata_Pelajaran || '-').trim(),
                status: 'Aktif'
              });
              importedCount++;
            }
          }
        }

        // 3. Pull BANK_SOAL
        if (data && Array.isArray(data.BANK_SOAL) && data.BANK_SOAL.length > 0) {
          data.BANK_SOAL.forEach(row => {
            if (!row.Pertanyaan) return;
            const existing = DB.bankSoal.find(q => q.id === row.ID_Soal);
            const soalObj = {
              id: row.ID_Soal || generateId('SOAL'),
              mapel: String(row.Mata_Pelajaran || 'Matematika').trim(),
              tipe: String(row.Tipe || 'PG').toUpperCase().includes('ESSAY') ? 'ESSAY' : 'PG',
              nomor: DB.bankSoal.length + 1,
              pertanyaan: String(row.Pertanyaan || '').trim(),
              gambarUrl: row.URL_Gambar && String(row.URL_Gambar).startsWith('http') ? String(row.URL_Gambar).trim() : (existing?.gambarUrl || ''),
              svgDiagram: existing?.svgDiagram || '',
              pilihan: {
                A: String(row.Pilihan_A || ''),
                B: String(row.Pilihan_B || ''),
                C: String(row.Pilihan_C || ''),
                D: String(row.Pilihan_D || ''),
                E: String(row.Pilihan_E || '')
              },
              kunci: String(row.Kunci_Jawaban || 'A').trim(),
              bobot: Number(row.Bobot_Nilai) || 10
            };
            if (existing) Object.assign(existing, soalObj);
            else {
              DB.bankSoal.push(soalObj);
              importedCount++;
            }
          });
        }

        // 4. Pull JADWAL_UJIAN
        if (data && Array.isArray(data.JADWAL_UJIAN)) {
          data.JADWAL_UJIAN.forEach(row => {
            if (!row.Mata_Pelajaran || !row.Kelas) return;
            const existing = DB.jadwal.find(j =>
              (row.ID_Jadwal && j.id === String(row.ID_Jadwal).trim()) ||
              (j.mapel === String(row.Mata_Pelajaran).trim() && j.kelas === String(row.Kelas).trim())
            );
            const jadwalObj = {
              id: String(row.ID_Jadwal || existing?.id || generateId('JDW')).trim(),
              judul: String(row.Judul_Ujian || existing?.judul || `Ujian ${row.Mata_Pelajaran}`).trim(),
              mapel: String(row.Mata_Pelajaran).trim(),
              kelas: String(row.Kelas).trim(),
              guru: String(row.Guru || existing?.guru || '-').trim(),
              tanggal: normalizeSheetDateStr(row.Tanggal, existing?.tanggal || getTodayDateString()),
              jamMulai: normalizeSheetTimeStr(row.Jam_Mulai, existing?.jamMulai || '07:30'),
              jamSelesai: normalizeSheetTimeStr(row.Jam_Selesai, existing?.jamSelesai || '23:59'),
              durasi: Number(row.Durasi) || existing?.durasi || 60,
              aktif: String(row.Aktif || 'YA').toUpperCase() !== 'TIDAK'
            };
            if (existing) Object.assign(existing, jadwalObj);
            else {
              DB.jadwal.push(jadwalObj);
              importedCount++;
            }
          });
        }

        // 5. Pull HASIL_UJIAN
        if (data && Array.isArray(data.HASIL_UJIAN)) {
          data.HASIL_UJIAN.forEach(row => {
            if (!row.Nama_Siswa || !row.Mata_Pelajaran) return;
            const existing = DB.hasilUjian.find(h => h.id === row.ID_Hasil);
            let parsedDetail = {};
            try { if (row.Detail_Jawaban_JSON) parsedDetail = JSON.parse(row.Detail_Jawaban_JSON); } catch {}
            const hasilObj = {
              id: row.ID_Hasil || generateId('HSL'),
              jadwalId: String(row.Jadwal_ID || existing?.jadwalId || ''),
              siswaId: String(row.Siswa_ID || existing?.siswaId || ''),
              namaSiswa: String(row.Nama_Siswa).trim(),
              kelas: String(row.Kelas || '-').trim(),
              mapel: String(row.Mata_Pelajaran).trim(),
              jumlahSoal: Number(row.Jumlah_Soal) || 0,
              benar: Number(row.Jawaban_Benar) || 0,
              salah: Number(row.Jawaban_Salah) || 0,
              nilaiPG: Number(row.Nilai_PG ?? row.Nilai_Akhir) || 0,
              nilaiEssay: Number(row.Nilai_Essay) || 0,
              nilaiAkhir: Number(row.Nilai_Akhir) || 0,
              essayGraded: String(row.Essay_Graded || 'YA').toUpperCase() === 'YA',
              waktuMulai: String(row.Waktu_Mulai || ''),
              waktuSelesai: String(row.Waktu_Selesai || ''),
              detailJawaban: Object.keys(parsedDetail).length ? parsedDetail : (existing?.detailJawaban || {}),
              skorEssayDetail: existing?.skorEssayDetail || {}
            };
            if (existing) Object.assign(existing, hasilObj);
            else {
              DB.hasilUjian.push(hasilObj);
              importedCount++;
            }
          });
        }

        // 6. Pull LIVE_SESSIONS (untuk Multi Monitoring Real-Time antar perangkat)
        if (data && Array.isArray(data.LIVE_SESSIONS)) {
          data.LIVE_SESSIONS.forEach(remoteSes => {
            if (!remoteSes || !remoteSes.id) return;
            if (examRuntime.active && examRuntime.sessionId === remoteSes.id) {
              if (examRuntime.locked && !remoteSes.locked) {
                examRuntime.locked = false;
                closeModal();
                showToast('Pengawas telah membuka kunci ujian Anda!', 'success');
                renderExamScreen();
              }
              if (remoteSes.status === 'Dihentikan Pengawas') {
                submitStudentExam(true, 'Ujian dihentikan oleh Pengawas.');
              }
              return;
            }
            const localSes = DB.liveSessions.find(s => s.id === remoteSes.id);
            if (localSes) Object.assign(localSes, remoteSes);
            else DB.liveSessions.push(remoteSes);
          });
        }

        DB.settings.lastSync = new Date().toISOString();
        try { localStorage.setItem(LOCAL_DB_KEY, JSON.stringify(DB)); } catch (e) {}
        updateOnlineIndicator();

        if (!silent) {
          showToast(`Sinkronisasi Pull berhasil! (${importedCount} data baru diperbarui dari Google Sheets)`, 'success');
          renderCurrentView();
        } else if (!examRuntime.active) {
          if (currentUser && ['monitoring', 'dashboard', 'hasil', 'jadwal', 'siswa_dashboard'].includes(currentRoute)) {
            renderCurrentView();
          } else if (!currentUser) {
            renderLoginView();
          }
        }
      } catch (err) {
        if (!silent) showToast('Gagal Pull data. Pastikan script Code.gs sudah di-deploy sebagai Web App (Who has access: Anyone).', 'error');
      } finally {
        isPullingFromGas = false;
      }
    }

      const badge = document.getElementById('online-status-badge');
      if (!badge) return;
      const qLen = getSyncQueue().length;
      const hasGas = Boolean(DB?.settings?.gasUrl && DB.settings.gasUrl.trim());
      if (navigator.onLine) {
        badge.className = 'inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold bg-emerald-100 text-emerald-800 border border-emerald-200';
        const modeLabel = (cloudConnected && hasGas)
          ? 'Online + Auto-Sync Sheets'
          : (hasGas ? 'Auto-Sync Sheets Aktif' : (cloudConnected ? 'Cloud Real-Time' : 'Online Lokal'));
        badge.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> ${modeLabel}${qLen > 0 ? ` (${qLen} antrean)` : ''}`;
      } else {
        badge.className = 'inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold bg-red-100 text-red-800 border border-red-200';

    async function handleLogin(e) {
      e.preventDefault();
      const username = document.getElementById('login-username').value.trim();
      const password = document.getElementById('login-password').value;
      if (!username || !password) {
        showToast('Username dan password wajib diisi.', 'warning');
        return;
      }
      const hashed = await hashPassword(password);
      const user = DB.users.find(u =>
        (u.username.toLowerCase() === username.toLowerCase() ||
          (u.role === 'siswa' && (u.noPeserta || '').toLowerCase() === username.toLowerCase())) &&
        u.passwordHash === hashed
      );
      if (!user) {
        showToast('Username/No. Peserta atau password salah!', 'error');
        return;
      }
      if (user.status !== 'Aktif') {
        showToast('Akun Anda dinonaktifkan. Hubungi Admin sekolah.', 'error');
        return;
      }
      currentUser = user;
      sessionStorage.setItem(SESSION_KEY, JSON.stringify({ id: user.id }));
      showToast(`Selamat datang, ${user.name}!`, 'success');
      if (user.role === 'pengawas') currentRoute = 'monitoring';
      else if (user.role === 'siswa') currentRoute = 'siswa_dashboard';
      else currentRoute = 'dashboard';
      renderApp();
    }

                <form onsubmit="handleLogin(event)" class="space-y-4">

                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">

                    <div class="relative">
                      <i class="fa-solid ${isSiswaTab ? 'fa-id-card' : 'fa-user-shield'} absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
                      <input id="login-username" type="text" required autocomplete="username"
                        placeholder="${isSiswaTab ? 'Ketik username atau nomor peserta...' : 'Ketik username admin / guru / pengawas...'}"
                        class="w-full pl-10 pr-4 py-3 rounded-xl border border-slate-300 bg-white text-slate-900 text-sm font-medium focus:ring-2 focus:ring-electric-600 focus:border-electric-600 outline-none transition" />

                  </div>

                  <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">Kata Sandi</label>

                  <button type="submit"
                    class="w-full py-3.5 px-4 rounded-xl ${isSiswaTab ? 'bg-electric-600 hover:bg-electric-700' : 'bg-navy-900 hover:bg-navy-800'} text-white font-bold text-sm shadow-md transition flex items-center justify-center gap-2">
                    <i class="fa-solid fa-right-to-bracket"></i> ${isSiswaTab ? 'Masuk ke Ruang Ujian' : 'Masuk ke Dashboard'}
                  </button>

                <div class="mt-5 p-3.5 rounded-xl bg-slate-50 border border-slate-200 text-xs text-slate-600 flex items-start gap-2.5">
                  <i class="fa-solid fa-circle-info text-electric-600 mt-0.5 shrink-0"></i>
                  <span>Mengalami kendala login atau lupa password? Silakan hubungi <strong>Pengawas Ruang</strong> atau <strong>Panitia Ujian Sekolah</strong>.</span>

    /* =========================================================================
       7. MAIN APPLICATION SHELL & NAVIGATION MENU
       ========================================================================= */
    function getMenuForRole(role) {
      if (role === 'admin') {
        return [
          { id: 'dashboard', label: 'Dashboard', icon: 'fa-chart-pie' },
          { id: 'siswa', label: 'Data Siswa', icon: 'fa-user-graduate' },
          { id: 'kartu_ujian', label: 'Kartu Ujian Siswa', icon: 'fa-id-card' },
          { id: 'guru', label: 'Data Guru', icon: 'fa-chalkboard-user' },
          { id: 'kelas', label: 'Data Kelas & Jurusan', icon: 'fa-school' },
          { id: 'mapel', label: 'Mata Pelajaran', icon: 'fa-book' },
          { id: 'bank_soal', label: 'Bank Soal', icon: 'fa-database' },
          { id: 'import_soal', label: 'Import Soal', icon: 'fa-file-import' },
          { id: 'jadwal', label: 'Jadwal Ujian', icon: 'fa-calendar-days' },
          { id: 'monitoring', label: 'Monitoring Ujian', icon: 'fa-tower-broadcast' },
          { id: 'hasil', label: 'Hasil Ujian', icon: 'fa-award' },
          { id: 'laporan', label: 'Laporan & Analisis', icon: 'fa-chart-column' },
          { id: 'sync', label: 'Online & Link Web App', icon: 'fa-globe' },
          { id: 'pengaturan', label: 'Pengaturan & Backup', icon: 'fa-gear' },
          { id: 'panduan', label: 'Panduan Penggunaan', icon: 'fa-circle-question' }
        ];
      }
      if (role === 'guru') {
        return [
          { id: 'dashboard', label: 'Dashboard Guru', icon: 'fa-chart-pie' },
          { id: 'kartu_ujian', label: 'Kartu Ujian Siswa', icon: 'fa-id-card' },
          { id: 'bank_soal', label: 'Bank Soal', icon: 'fa-database' },
          { id: 'import_soal', label: 'Import Soal', icon: 'fa-file-import' },
          { id: 'jadwal', label: 'Jadwal & Durasi', icon: 'fa-calendar-days' },
          { id: 'hasil', label: 'Hasil & Nilai Essay', icon: 'fa-award' },
          { id: 'laporan', label: 'Laporan & Ekspor', icon: 'fa-chart-column' },
          { id: 'panduan', label: 'Panduan Guru', icon: 'fa-circle-question' }
        ];
      }
      if (role === 'pengawas') {
        return [
          { id: 'monitoring', label: 'Monitoring Real-Time', icon: 'fa-tower-broadcast' },
          { id: 'peserta_pengawas', label: 'Daftar Peserta', icon: 'fa-users' },
          { id: 'kartu_ujian', label: 'Kartu Ujian Siswa', icon: 'fa-id-card' },
          { id: 'log_pelanggaran', label: 'Log Pelanggaran', icon: 'fa-shield-exclamation' },
          { id: 'berita_acara', label: 'Berita Acara Ujian', icon: 'fa-clipboard-list' },
          { id: 'panduan', label: 'Panduan Pengawas', icon: 'fa-circle-question' }
        ];
      }
      return [
        { id: 'siswa_dashboard', label: 'Jadwal Ujian Saya', icon: 'fa-laptop-file' },
        { id: 'siswa_kartu', label: 'Kartu Ujian Saya', icon: 'fa-id-card' },
        { id: 'siswa_riwayat', label: 'Status & Riwayat', icon: 'fa-clock-rotate-left' },
        { id: 'panduan', label: 'Panduan Siswa', icon: 'fa-circle-question' }
      ];
    }

    function navigateTo(route) {
      currentRoute = route;
      sidebarOpen = false;
      if (monitoringInterval) { clearInterval(monitoringInterval); monitoringInterval = null; }
      renderApp();
    }

    function toggleSidebar() {
      sidebarOpen = !sidebarOpen;
      const drawer = document.getElementById('mobile-sidebar-drawer');
      const backdrop = document.getElementById('mobile-sidebar-backdrop');
      if (drawer && backdrop) {
        drawer.classList.toggle('-translate-x-full', !sidebarOpen);
        backdrop.classList.toggle('hidden', !sidebarOpen);
      }
    }

    function renderApp() {
      if (!currentUser) {
        renderLoginView();
        return;
      }
      if (examRuntime.active) {
        renderExamScreen();
        return;
      }

      const menus = getMenuForRole(currentUser.role);
      const roleLabels = { admin: 'Administrator', guru: 'Guru Mapel', pengawas: 'Pengawas Ujian', siswa: 'Peserta Didik' };
      const roleColors = { admin: 'bg-electric-600', guru: 'bg-emerald-600', pengawas: 'bg-amber-600', siswa: 'bg-indigo-600' };

      const navHtml = menus.map(m => {
        const active = currentRoute === m.id;
        return `
          <button onclick="navigateTo('${m.id}')"
            class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-semibold transition ${active ? 'bg-electric-600 text-white shadow-md' : 'text-slate-300 hover:bg-navy-800 hover:text-white'}">
            <i class="fa-solid ${m.icon} w-5 text-center"></i>
            <span class="truncate">${m.label}</span>
          </button>
        `;
      }).join('');

      document.getElementById('app-root').innerHTML = `
        <div class="min-h-screen flex bg-slate-100">
          <div id="mobile-sidebar-backdrop" onclick="toggleSidebar()" class="fixed inset-0 bg-slate-900/60 z-40 lg:hidden ${sidebarOpen ? '' : 'hidden'}"></div>

          <aside id="mobile-sidebar-drawer"
            class="fixed lg:sticky top-0 left-0 z-50 h-screen w-68 max-w-[270px] bg-navy-900 text-white flex flex-col border-r border-slate-800 transition-transform duration-200 ${sidebarOpen ? 'translate-x-0' : '-translate-x-full lg:translate-x-0'}">
            <div class="p-5 border-b border-slate-800 flex items-center justify-between gap-3">
              <div class="flex items-center gap-3 min-w-0">
                ${getSchoolLogoHtml('w-10 h-10')}
                <div class="min-w-0">
                  <div class="font-extrabold text-sm tracking-tight truncate">UJIAN DIGITAL</div>
                  <div class="text-[11px] text-slate-400 truncate">${escapeHtml(DB.settings.schoolName)}</div>
                </div>
              </div>
              <button onclick="toggleSidebar()" class="lg:hidden text-slate-400 hover:text-white p-1.5">
                <i class="fa-solid fa-xmark text-lg"></i>
              </button>
            </div>

            <nav class="flex-1 overflow-y-auto p-3 space-y-1">
              ${navHtml}
            </nav>

            <div class="p-4 border-t border-slate-800 bg-navy-950">
              <div class="flex items-center gap-3 mb-3">
                <div class="w-9 h-9 rounded-full ${roleColors[currentUser.role]} flex items-center justify-center font-bold text-sm shrink-0">
                  ${escapeHtml(currentUser.name.charAt(0).toUpperCase())}
                </div>
                <div class="min-w-0">
                  <div class="text-xs font-bold text-white truncate">${escapeHtml(currentUser.name)}</div>
                  <div class="text-[11px] text-electric-400 font-medium">${roleLabels[currentUser.role]}</div>
                </div>
              </div>
              <button onclick="logout()" class="w-full py-2 px-3 rounded-xl bg-red-600/20 hover:bg-red-600 text-red-300 hover:text-white text-xs font-bold transition flex items-center justify-center gap-2 border border-red-600/30">
                <i class="fa-solid fa-right-from-bracket"></i> Keluar
              </button>
            </div>
          </aside>

          <div class="flex-1 flex flex-col min-w-0">
            <header class="sticky top-0 z-30 bg-white border-b border-slate-200 px-4 sm:px-6 py-3.5 flex items-center justify-between gap-4 shadow-sm">
              <div class="flex items-center gap-3 min-w-0">
                <button onclick="toggleSidebar()" class="lg:hidden p-2 rounded-xl bg-slate-100 text-navy-900 hover:bg-slate-200">
                  <i class="fa-solid fa-bars text-lg"></i>
                </button>
                <div class="min-w-0">
                  <h1 class="text-base sm:text-lg font-extrabold text-navy-900 truncate" id="page-title">Dashboard</h1>
                  <p class="text-xs text-slate-500 hidden sm:block truncate">${escapeHtml(DB.settings.schoolName)} &bull; Tahun Pelajaran 2026/2027</p>
                </div>
              </div>

              <div class="flex items-center gap-2.5 shrink-0">
                <span id="online-status-badge"></span>
                ${currentUser.role === 'admin' ? `
                  <button onclick="navigateTo('sync')" class="hidden sm:inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-blue-50 text-electric-700 hover:bg-blue-100 text-xs font-bold border border-blue-200 transition">
                    <i class="fa-solid fa-globe"></i> Online &amp; Link Akses
                  </button>
                ` : ''}
              </div>
            </header>

            <main id="main-content" class="flex-1 p-4 sm:p-6 max-w-7xl w-full mx-auto"></main>
          </div>
        </div>
      `;

      updateOnlineIndicator();
      renderCurrentView();
    }

    function setPageTitle(text) {
      const el = document.getElementById('page-title');
      if (el) el.textContent = text;
    }

    function renderCurrentView() {
      const main = document.getElementById('main-content');
      if (!main) return;
      if (activeChart) { activeChart.destroy(); activeChart = null; }

      switch (currentRoute) {
        case 'dashboard': renderDashboardView(main); break;
        case 'siswa': renderUsersView(main, 'siswa'); break;
        case 'kartu_ujian': renderKartuUjianAdminView(main); break;
        case 'guru': renderUsersView(main, 'guru'); break;
        case 'kelas': renderKelasView(main); break;
        case 'mapel': renderMapelView(main); break;
        case 'bank_soal': renderBankSoalView(main); break;
        case 'import_soal': renderImportSoalView(main); break;
        case 'jadwal': renderJadwalView(main); break;
        case 'monitoring': renderMonitoringView(main); break;
        case 'peserta_pengawas': renderPesertaPengawasView(main); break;
        case 'log_pelanggaran': renderLogPelanggaranView(main); break;
        case 'berita_acara': renderBeritaAcaraView(main); break;
        case 'hasil': renderHasilUjianView(main); break;
        case 'laporan': renderLaporanView(main); break;
        case 'sync': renderSyncView(main); break;
        case 'pengaturan': renderPengaturanView(main); break;
        case 'siswa_dashboard': renderSiswaDashboardView(main); break;
        case 'siswa_kartu': renderSiswaKartuUjianView(main); break;
        case 'siswa_riwayat': renderSiswaRiwayatView(main); break;
        case 'panduan': renderPanduanView(main); break;
        default: renderDashboardView(main);
      }
    }

    /* =========================================================================
       8. ADMIN & GURU DASHBOARD (8 STAT CARDS + CHART.JS)
       ========================================================================= */
    function renderDashboardView(main) {
      setPageTitle(currentUser.role === 'guru' ? 'Dashboard Guru' : 'Dashboard Utama');

      const totalSiswa = DB.users.filter(u => u.role === 'siswa').length;
      const totalGuru = DB.users.filter(u => u.role === 'guru').length;
      const totalKelas = DB.kelas.length;
      const totalMapel = DB.mapel.length;
      const ujianAktif = DB.jadwal.filter(j => j.aktif).length;
      const sedangUjian = DB.liveSessions.filter(s => s.status === 'Sedang Mengerjakan').length;
      const sudahSelesai = DB.hasilUjian.length;
      const melanggar = DB.liveSessions.filter(s => s.pelanggaran > 0).length;

      const stats = [
        { label: 'Total Siswa', val: totalSiswa, icon: 'fa-user-graduate', bg: 'bg-blue-600' },
        { label: 'Total Guru', val: totalGuru, icon: 'fa-chalkboard-user', bg: 'bg-indigo-600' },
        { label: 'Total Kelas', val: totalKelas, icon: 'fa-school', bg: 'bg-navy-700' },
        { label: 'Mata Pelajaran', val: totalMapel, icon: 'fa-book', bg: 'bg-cyan-600' },
        { label: 'Ujian Aktif', val: ujianAktif, icon: 'fa-calendar-check', bg: 'bg-emerald-600' },
        { label: 'Sedang Ujian', val: sedangUjian, icon: 'fa-pen-to-square', bg: 'bg-electric-600' },
        { label: 'Sudah Selesai', val: sudahSelesai, icon: 'fa-circle-check', bg: 'bg-teal-600' },
        { label: 'Indikasi Melanggar', val: melanggar, icon: 'fa-triangle-exclamation', bg: 'bg-red-600' }
      ];

      main.innerHTML = `
        <div class="space-y-6">
          <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
            ${stats.map(s => `
              <div class="bg-white rounded-2xl border border-slate-200 p-4 sm:p-5 shadow-sm flex items-center justify-between gap-3">
                <div>
                  <p class="text-xs font-bold uppercase tracking-wider text-slate-500">${s.label}</p>
                  <p class="text-2xl sm:text-3xl font-extrabold text-navy-900 mt-1">${s.val}</p>
                </div>
                <div class="w-11 h-11 rounded-xl ${s.bg} text-white flex items-center justify-center shadow-sm shrink-0">
                  <i class="fa-solid ${s.icon} text-lg"></i>
                </div>
              </div>
            `).join('')}
          </div>

          <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="lg:col-span-2 bg-white rounded-2xl border border-slate-200 p-5 shadow-sm">
              <div class="flex items-center justify-between mb-4">
                <div>
                  <h3 class="font-bold text-navy-900 text-base">Grafik Rata-Rata Hasil Ujian per Mata Pelajaran</h3>
                  <p class="text-xs text-slate-500">Data terupdate otomatis dari hasil pengerjaan siswa</p>
                </div>
                <button onclick="navigateTo('laporan')" class="text-xs font-bold text-electric-600 hover:underline">Lihat Laporan &rarr;</button>
              </div>
              <div class="h-64 w-full">
                <canvas id="dashboard-score-chart"></canvas>
              </div>
            </div>

            <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm flex flex-col">
              <div class="flex items-center justify-between mb-4">
                <h3 class="font-bold text-navy-900 text-base">Log Pelanggaran Terbaru</h3>
                <span class="px-2 py-0.5 rounded-full text-xs font-bold bg-red-100 text-red-700">${DB.logAktivitas.length}</span>
              </div>
              <div class="space-y-3 flex-1 overflow-y-auto max-h-64">
                ${DB.logAktivitas.length === 0 ? `<p class="text-sm text-slate-400 text-center py-8">Belum ada catatan pelanggaran.</p>` :
                  DB.logAktivitas.slice().reverse().slice(0, 5).map(l => `
                    <div class="p-3 rounded-xl bg-red-50 border border-red-200 text-xs">
                      <div class="flex items-center justify-between font-bold text-red-900">
                        <span>${escapeHtml(l.namaSiswa)}</span>
                        <span class="px-1.5 py-0.5 rounded bg-red-600 text-white">${l.jumlahPelanggaran}x</span>
                      </div>
                      <p class="text-red-700 mt-1">${escapeHtml(l.jenisPelanggaran)}</p>
                      <p class="text-slate-500 mt-1">${formatDateTime(l.waktu)}</p>
                    </div>
                  `).join('')}
              </div>
              ${currentUser.role === 'admin' ? `
                <button onclick="navigateTo('monitoring')" class="mt-4 w-full py-2.5 rounded-xl bg-navy-900 hover:bg-navy-800 text-white text-xs font-bold transition">
                  Buka Monitoring Real-Time
                </button>
              ` : ''}
            </div>
          </div>
        </div>
      `;

      const ctx = document.getElementById('dashboard-score-chart');
      if (ctx && typeof Chart !== 'undefined') {
        const labels = DB.mapel.map(m => m.nama);
        const avgData = labels.map(mName => {
          const items = DB.hasilUjian.filter(h => h.mapel === mName);
          if (!items.length) return 0;
          return Math.round(items.reduce((a, b) => a + Number(b.nilaiAkhir || 0), 0) / items.length);
        });

        activeChart = new Chart(ctx, {
          type: 'bar',
          data: {
            labels,
            datasets: [{
              label: 'Rata-rata Nilai',
              data: avgData,
              backgroundColor: ['#2563EB', '#1E3A8A', '#0EA5E9', '#3B82F6'],
              borderRadius: 10,
              maxBarThickness: 56
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
              y: { beginAtZero: true, max: 100, grid: { color: '#E2E8F0' } },
              x: { grid: { display: false } }
            },
            plugins: { legend: { display: false } }
          }
        });
      }
    }

    /* =========================================================================
       9. CRUD DATA SISWA & GURU
       ========================================================================= */
    let userSearchQuery = '';
    let userClassFilter = 'ALL';

    function renderUsersView(main, roleType) {
      const isSiswa = roleType === 'siswa';
      setPageTitle(isSiswa ? 'Data Siswa' : 'Data Guru & Pengawas');

      const allRoleUsers = DB.users.filter(u => isSiswa ? u.role === 'siswa' : (u.role === 'guru' || u.role === 'pengawas'));
      const users = allRoleUsers.filter(u => {
        const q = userSearchQuery.toLowerCase();
        const matchText = !q ||
          (u.name || '').toLowerCase().includes(q) ||
          (u.username || '').toLowerCase().includes(q) ||
          (u.noPeserta || '').toLowerCase().includes(q) ||
          (u.kelas || '').toLowerCase().includes(q) ||
          (u.mapel || '').toLowerCase().includes(q);
        const matchClass = !isSiswa || userClassFilter === 'ALL' || u.kelas === userClassFilter;
        return matchText && matchClass;
      });

      main.innerHTML = `
        <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
          <div class="p-5 border-b border-slate-200 flex flex-wrap items-center justify-between gap-3">
            <div>
              <h2 class="text-base font-bold text-navy-900">Daftar ${isSiswa ? 'Peserta Didik (Siswa)' : 'Guru & Pengawas'}</h2>
              <p class="text-xs text-slate-500">Menampilkan ${users.length} dari ${allRoleUsers.length} akun terdaftar</p>
            </div>
            <div class="flex flex-wrap items-center gap-2">
              <div class="relative">
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                <input type="text" value="${escapeHtml(userSearchQuery)}" oninput="userSearchQuery=this.value; renderCurrentView();"
                  placeholder="Cari nama, username${isSiswa ? ', no peserta' : ''}..."
                  class="pl-8 pr-3 py-2 rounded-xl border border-slate-300 text-xs font-medium w-48 sm:w-56 focus:border-electric-600 outline-none" />
              </div>
              ${isSiswa ? `
                <select onchange="userClassFilter=this.value; renderCurrentView();" class="px-3 py-2 rounded-xl border border-slate-300 text-xs font-bold bg-white">
                  <option value="ALL">Semua Kelas (${allRoleUsers.length})</option>
                  ${DB.kelas.map(k => `<option value="${escapeHtml(k.nama)}" ${userClassFilter === k.nama ? 'selected' : ''}>Kelas ${escapeHtml(k.nama)}</option>`).join('')}
                </select>
                <button onclick="navigateTo('kartu_ujian')" class="px-3.5 py-2.5 rounded-xl bg-amber-500 hover:bg-amber-600 text-slate-950 text-xs font-bold shadow-sm flex items-center gap-1.5 transition">
                  <i class="fa-solid fa-id-card"></i> Cetak Kartu Ujian
                </button>
              ` : ''}
              <button onclick="openUserModal('${roleType}')" class="px-4 py-2.5 rounded-xl bg-electric-600 hover:bg-electric-700 text-white text-xs font-bold shadow-sm flex items-center gap-2 transition">
                <i class="fa-solid fa-plus"></i> Tambah ${isSiswa ? 'Siswa' : 'Guru / Pengawas'}
              </button>
            </div>
          </div>

    async function saveUserForm(roleType, editId) {
      const isSiswa = roleType === 'siswa';
      const name = document.getElementById('uf-name').value.trim();
      const username = document.getElementById('uf-username').value.trim();
      const password = document.getElementById('uf-password').value;
      const status = document.getElementById('uf-status').value;

      if (!name || !username) return showToast('Nama dan username wajib diisi.', 'warning');

      const duplicate = DB.users.find(u => u.username.toLowerCase() === username.toLowerCase() && u.id !== editId);
      if (duplicate) return showToast('Username sudah digunakan akun lain.', 'error');

      if (editId) {
        const u = DB.users.find(x => x.id === editId);
        if (u) {
          u.name = name;
          u.username = username;
          u.status = status;
          if (password) u.passwordHash = await hashPassword(password);
          if (isSiswa) {
            u.noPeserta = document.getElementById('uf-nopeserta').value.trim();
            u.kelas = document.getElementById('uf-kelas').value;
            u.ruangUjian = document.getElementById('uf-ruang').value.trim() || DB.settings.defaultRoom;
          } else {
            u.role = document.getElementById('uf-role').value;
            u.mapel = document.getElementById('uf-mapel').value;
          }
        }
      } else {
        if (!password) return showToast('Password wajib diisi untuk akun baru.', 'warning');
        const newHash = await hashPassword(password);
        DB.users.push({
          id: generateId(isSiswa ? 'USR-SIS' : 'USR-GRU'),
          name, username, passwordHash: newHash, status,
          role: isSiswa ? 'siswa' : document.getElementById('uf-role').value,
          noPeserta: isSiswa ? document.getElementById('uf-nopeserta').value.trim() : undefined,
          kelas: isSiswa ? document.getElementById('uf-kelas').value : undefined,
          ruangUjian: isSiswa ? (document.getElementById('uf-ruang').value.trim() || DB.settings.defaultRoom) : undefined,
          mapel: !isSiswa ? document.getElementById('uf-mapel').value : undefined
        });
      }

      saveDatabase();
      closeModal();
      showToast('Data akun berhasil disimpan!', 'success');
      renderCurrentView();
    }

    function getStudentExamNumber(siswa) {
      if (siswa.noPeserta && siswa.noPeserta.trim()) return siswa.noPeserta.trim();
      const suffix = siswa.id.replace(/[^A-Z0-9]/gi, '').slice(-5);
      return `26-${(siswa.kelas || '00').replace(/[^A-Z0-9]/gi, '')}-${suffix}`;
    }

    function generateDeterministicQrSvg(seedText) {
      const size = 9;
      let hash = 2166136261;
      for (let i = 0; i < seedText.length; i++) {
        hash ^= seedText.charCodeAt(i);
        hash = Math.imul(hash, 16777619);
      }
      const cells = [];
      for (let r = 0; r < size; r++) {
        for (let c = 0; c < size; c++) {
          const isFinderTL = r < 3 && c < 3;
          const isFinderTR = r < 3 && c >= size - 3;
          const isFinderBL = r >= size - 3 && c < 3;
          let filled = false;
          if (isFinderTL || isFinderTR || isFinderBL) {
            const lr = isFinderBL ? r - (size - 3) : r;
            const lc = isFinderTR ? c - (size - 3) : c;
            filled = (lr === 0 || lr === 2 || lc === 0 || lc === 2 || (lr === 1 && lc === 1));
          } else {
            const bit = ((hash >>> ((r * size + c) % 24)) ^ (r * 7 + c * 13)) & 1;
            filled = bit === 1;
          }
          if (filled) {
            cells.push(`<rect x="${c * 6 + 3}" y="${r * 6 + 3}" width="5.2" height="5.2" rx="0.8" fill="#0F172A"/>`);
          }
        }
      }
      return `<svg viewBox="0 0 60 60" class="w-14 h-14 bg-white p-1 rounded-lg border border-slate-300 shrink-0" xmlns="http://www.w3.org/2000/svg">${cells.join('')}</svg>`;
    }

    function printExamCards(siswaIds) {
      const list = DB.users.filter(u => u.role === 'siswa' && siswaIds.includes(u.id));
      if (!list.length) return showToast('Tidak ada kartu untuk dicetak.', 'warning');
      const printSheet = document.getElementById('print-cards-sheet');
      printSheet.innerHTML = list.map(s => buildExamCardHtml(s)).join('');
      setTimeout(() => {
        window.print();
      }, 150);
    }

    function exportExamCardsPdf(siswaIds) {
      if (!window.jspdf) return showToast('Library jsPDF belum termuat.', 'error');
      const list = DB.users.filter(u => u.role === 'siswa' && siswaIds.includes(u.id));
      if (!list.length) return showToast('Tidak ada kartu siswa yang dipilih.', 'warning');

      const { jsPDF } = window.jspdf;
      const doc = new jsPDF('portrait', 'mm', 'a4');
      const cardW = 92;
      const cardH = 86;
      const marginX = 10;
      const marginY = 10;
      const gapX = 6;
      const gapY = 8;

      list.forEach((siswa, idx) => {
        if (idx > 0 && idx % 6 === 0) doc.addPage();
        const posInPage = idx % 6;
        const col = posInPage % 2;
        const row = Math.floor(posInPage / 2);
        const x = marginX + col * (cardW + gapX);
        const y = marginY + row * (cardH + gapY);

        doc.setDrawColor(15, 23, 42);
        doc.setLineWidth(0.6);
        doc.roundedRect(x, y, cardW, cardH, 3, 3);

        doc.setFillColor(15, 23, 42);
        doc.roundedRect(x, y, cardW, 18, 3, 3, 'F');
        doc.rect(x, y + 12, cardW, 6, 'F');

        doc.setTextColor(251, 191, 36);
        doc.setFontSize(7.5);
        doc.setFont('helvetica', 'bold');
        doc.text((DB.settings.cardTitle || 'KARTU PESERTA UJIAN').toUpperCase(), x + 4, y + 6);

        doc.setTextColor(255, 255, 255);
        doc.setFontSize(9.5);
        doc.text(DB.settings.schoolName || 'UPTD SMPN 2 Ketapang', x + 4, y + 11.5);

        doc.setTextColor(203, 213, 225);
        doc.setFontSize(7);
        doc.setFont('helvetica', 'normal');
        doc.text(`Tahun Pelajaran ${DB.settings.academicYear || '2026/2027'} | NPSN: ${DB.settings.npsn}`, x + 4, y + 16);

        doc.setTextColor(15, 23, 42);
        doc.setFontSize(8);
        const examNo = getStudentExamNumber(siswa);
        const rows = [
          ['No. Peserta', `: ${examNo}`],
          ['Nama Siswa', `: ${siswa.name.toUpperCase()}`],
          ['Kelas', `: ${siswa.kelas || '-'}`],
          ['Ruang Ujian', `: ${siswa.ruangUjian || DB.settings.defaultRoom || '-'}`],
          ['Username', `: ${siswa.username}`]
        ];
        if (kartuShowDefaultPass) rows.push(['Password Awal', ': siswa123']);

        let curY = y + 24;
        rows.forEach(([lbl, val]) => {
          doc.setFont('helvetica', 'normal');
          doc.setTextColor(100, 116, 139);
          doc.text(lbl, x + 4, curY);
          doc.setFont('helvetica', 'bold');
          doc.setTextColor(15, 23, 42);
          doc.text(String(val).slice(0, 32), x + 28, curY);
          curY += 5.2;
        });

        const footY = y + cardH - 18;
        doc.setDrawColor(203, 213, 225);
        doc.setLineWidth(0.3);
        doc.line(x + 4, footY, x + cardW - 4, footY);

        doc.setFontSize(6.5);
        doc.setTextColor(100, 116, 139);
        doc.text('Harap dibawa saat ujian berlangsung.', x + 4, footY + 5);
        doc.text('Kepala Sekolah,', x + cardW - 4, footY + 4, { align: 'right' });
        doc.setFont('helvetica', 'bold');
        doc.setTextColor(15, 23, 42);
        doc.text(DB.settings.headmasterName || 'Kepala Sekolah', x + cardW - 4, footY + 11.5, { align: 'right' });
        doc.setFont('helvetica', 'normal');
        doc.setFontSize(5.8);
        doc.setTextColor(100, 116, 139);
        doc.text(`NIP. ${DB.settings.headmasterNip || '-'}`, x + cardW - 4, footY + 15, { align: 'right' });
      });

      const fileName = list.length === 1
        ? `Kartu_Ujian_${list[0].name.replace(/\s+/g, '_')}.pdf`
        : `Kartu_Ujian_Siswa_${kartuKelasFilter}_${getTodayDateString()}.pdf`;
      doc.save(fileName);
      showToast(`PDF Kartu Ujian (${list.length} siswa) berhasil diunduh!`, 'success');
    }

    function confirmDeleteBankSoalByMapel(mapelName) {
      const count = DB.bankSoal.filter(q => q.mapel === mapelName).length;
      confirmModal({
        title: 'Hapus Bank Soal Mata Pelajaran?',
        message: `Anda akan menghapus seluruh <strong>${count} soal</strong> pada bank soal mata pelajaran <strong>${escapeHtml(mapelName)}</strong>. Tindakan ini tidak dapat dibatalkan.`,
        confirmText: 'Ya, Hapus Bank Soal',
        confirmClass: 'bg-red-600 hover:bg-red-700 text-white',
        onConfirm: () => {
          DB.bankSoal = DB.bankSoal.filter(q => q.mapel !== mapelName);
          selectedSoalIds.clear();
          if (selectedMapelFilter === mapelName) selectedMapelFilter = 'ALL';
          saveDatabase();
          showToast(`Bank soal ${mapelName} (${count} soal) berhasil dihapus.`, 'success');
          renderCurrentView();
        }
      });

    function handleImportExcelOrCsv(event) {
      const file = event.target.files?.[0];
      if (!file) return;
      const mapel = document.getElementById('imp-mapel').value;
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const data = new Uint8Array(e.target.result);
          const workbook = XLSX.read(data, { type: 'array' });
          const sheet = workbook.Sheets[workbook.SheetNames[0]];
          const json = XLSX.utils.sheet_to_json(sheet);
          parseStructuredRowsToBuffer(json, mapel);
        } catch (err) {
          showToast('Gagal membaca file Excel/CSV. Pastikan sesuai template.', 'error');
        }
      };
      reader.readAsArrayBuffer(file);
