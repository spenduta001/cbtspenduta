    function parseStructuredRowsToBuffer(rows, mapel) {
      importedQuestionsBuffer = rows.map((r, i) => {
        const tipe = String(r['Tipe'] || r['tipe'] || 'PG').toUpperCase().includes('ESSAY') ? 'ESSAY' : 'PG';
        return {
          id: generateId('SOAL'),
          mapel,
          tipe,
          nomor: Number(r['Nomor'] || r['No'] || i + 1),
          pertanyaan: String(r['Pertanyaan'] || r['Soal'] || '').trim(),
          gambarUrl: String(r['Gambar'] || r['URL Gambar'] || '').trim(),
          svgDiagram: '',
          pilihan: {
            A: String(r['Pilihan A'] || r['A'] || '').trim(),
            B: String(r['Pilihan B'] || r['B'] || '').trim(),
            C: String(r['Pilihan C'] || r['C'] || '').trim(),
            D: String(r['Pilihan D'] || r['D'] || '').trim(),
            E: String(r['Pilihan E'] || r['E'] || '').trim()
          },
          kunci: String(r['Kunci'] || r['Kunci Jawaban'] || 'A').trim().toUpperCase(),
          bobot: Number(r['Bobot'] || r['Bobot Nilai'] || 10)
        };
      }).filter(q => q.pertanyaan.length > 0);

      document.getElementById('import-preview-container').innerHTML = renderImportPreviewHtml();
      showToast(`Berhasil membaca ${importedQuestionsBuffer.length} soal! Silakan tinjau lalu klik Simpan.`, 'success');
    }

    async function handleImportDocx(event) {
      const file = event.target.files?.[0];
      if (!file) return;
      if (typeof mammoth === 'undefined') return showToast('Library Mammoth.js belum termuat.', 'error');
      const mapel = document.getElementById('imp-mapel').value;
      const reader = new FileReader();
      reader.onload = async (e) => {
        try {
          const result = await mammoth.convertToHtml({ arrayBuffer: e.target.result });
          const parser = new DOMParser();
          const doc = parser.parseFromString(result.value, 'text/html');
          const blocks = Array.from(doc.body.children);

          const parsed = [];
          let current = null;

          blocks.forEach(el => {
            const text = el.textContent.trim();
            const img = el.querySelector('img');
            const imgSrc = img ? img.getAttribute('src') : '';

            if (/^\d+[\.\)]\s+/.test(text)) {
              if (current) parsed.push(current);
              current = {
                id: generateId('SOAL'), mapel, tipe: 'PG', nomor: parsed.length + 1,
                pertanyaan: text.replace(/^\d+[\.\)]\s+/, ''), gambarUrl: imgSrc, svgDiagram: '',
                pilihan: { A: '', B: '', C: '', D: '', E: '' }, kunci: 'A', bobot: 10
              };
            } else if (current) {
              if (imgSrc && !current.gambarUrl) current.gambarUrl = imgSrc;
              const optMatch = text.match(/^([A-Ea-e])[\.\)]\s*(.+)$/);
              const kunciMatch = text.match(/^kunci\s*[:=]\s*(.+)$/i);
              const bobotMatch = text.match(/^bobot\s*[:=]\s*(\d+)/i);
              if (optMatch) {
                current.pilihan[optMatch[1].toUpperCase()] = optMatch[2].trim();
              } else if (kunciMatch) {
                current.kunci = kunciMatch[1].trim().toUpperCase();
              } else if (bobotMatch) {
                current.bobot = Number(bobotMatch[1]);
              } else if (text) {
                current.pertanyaan += ' ' + text;
              }
            }
          });
          if (current) parsed.push(current);

          parsed.forEach(q => {
            if (!q.pilihan.A && !q.pilihan.B) q.tipe = 'ESSAY';
          });

          importedQuestionsBuffer = parsed;
          document.getElementById('import-preview-container').innerHTML = renderImportPreviewHtml();
          showToast(`Berhasil mengekstrak ${parsed.length} soal dari Word (.docx)!`, 'success');
        } catch (err) {
          showToast('Gagal memproses file .docx.', 'error');
        }
      };
      reader.readAsArrayBuffer(file);
    }

    async function handleImportGoogleSheets() {
      let url = document.getElementById('imp-gsheet-url').value.trim();
      const mapel = document.getElementById('imp-mapel').value;
      if (!url) return showToast('Masukkan URL Google Sheets terlebih dahulu.', 'warning');
      if (url.includes('/edit')) {
        url = url.replace(/\/edit.*$/, '/export?format=csv');
      }
      try {
        const res = await fetch(url);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const csvText = await res.text();
        const wb = XLSX.read(csvText, { type: 'string' });
        const json = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
        parseStructuredRowsToBuffer(json, mapel);
      } catch (e) {
        showToast('Gagal menarik Google Sheets. Pastikan sheet disetel Publik (Siapa saja memiliki link).', 'error');
      }
    }

    /* -------------------------------------------------------------------------
       GOOGLE FORM LINK & HTML/TEXT EXTRACTOR
       ------------------------------------------------------------------------- */
    function normalizeGoogleFormUrl(rawUrl) {
      let url = rawUrl.trim();
      if (!url) return '';
      if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
      if (url.includes('docs.google.com/forms')) {
        url = url.split('#')[0];
        if (/\/edit(\?.*)?$/i.test(url)) {
          url = url.replace(/\/edit(\?.*)?$/i, '/viewform');
        } else if (!/\/(viewform|formResponse)/i.test(url)) {
          const [base, query] = url.split('?');
          url = base.replace(/\/+$/, '') + '/viewform' + (query ? '?' + query : '');
        }
      }
      return url;
    }

    function isIdentityFieldQuestion(title) {
      const lower = title.toLowerCase().trim();
      return /^(nama(\s+lengkap|\s+siswa|\s+peserta)?|kelas|no\.?\s*(absen|urut|peserta|ujian)|nisn?|token|email|alamat\s+email|jurusan|asal\s+sekolah)$/i.test(lower);
    }

    function extractBalancedJsonArray(text, startIdx) {
      let depth = 0;
      let inString = false;
      let escapeNext = false;
      for (let i = startIdx; i < text.length; i++) {
        const ch = text[i];
        if (escapeNext) {
          escapeNext = false;
          continue;
        }
        if (ch === '\\') {
          escapeNext = true;
          continue;
        }
        if (ch === '"') {
          inString = !inString;
          continue;
        }
        if (!inString) {
          if (ch === '[') depth++;
          else if (ch === ']') {
            depth--;
            if (depth === 0) return text.slice(startIdx, i + 1);
          }
        }
      }
      return null;
    }

    function parseGoogleFormHtmlToQuestions(htmlString, mapel) {
      const results = [];
      const markerIdx = htmlString.indexOf('FB_PUBLIC_LOAD_DATA_');
      if (markerIdx !== -1) {
        const eqIdx = htmlString.indexOf('=', markerIdx);
        const arrStart = eqIdx !== -1 ? htmlString.indexOf('[', eqIdx) : -1;
        if (arrStart !== -1) {
          const rawJsonArray = extractBalancedJsonArray(htmlString, arrStart);
          if (rawJsonArray) {
            try {
              const fbData = JSON.parse(rawJsonArray);
              const items = fbData?.[1]?.[1];
              if (Array.isArray(items)) {
                items.forEach(item => {
                  if (!Array.isArray(item)) return;
                  const qTitle = String(item[1] || '').trim();
                  const qDesc = String(item[2] || '').trim();
                  const qType = item[3];
                  if (!qTitle || qType === 6 || qType === 8) return;
                  if (isIdentityFieldQuestion(qTitle)) return;

                  const fullQuestion = qDesc ? `${qTitle} (${qDesc})` : qTitle;
                  let imgUrl = '';
                  if (Array.isArray(item[6]) && item[6][0]) {
                    imgUrl = `https://lh3.googleusercontent.com/d/${item[6][0]}`;
                  } else if (Array.isArray(item[9]) && item[9][0]) {
                    imgUrl = `https://lh3.googleusercontent.com/d/${item[9][0]}`;
                  }

                  const entryMeta = Array.isArray(item[4]) && Array.isArray(item[4][0]) ? item[4][0] : null;
                  const rawChoices = entryMeta && Array.isArray(entryMeta[1]) ? entryMeta[1] : [];

                  if ((qType === 2 || qType === 3 || qType === 4) && rawChoices.length >= 2) {
                    const letters = ['A', 'B', 'C', 'D', 'E'];
                    const pilihan = { A: '', B: '', C: '', D: '', E: '' };
                    rawChoices.slice(0, 5).forEach((ch, idx) => {
                      const optText = Array.isArray(ch) ? String(ch[0] || '').trim() : '';
                      if (optText) pilihan[letters[idx]] = optText;
                    });
                    results.push({
                      id: generateId('SOAL'),
                      mapel,
                      tipe: 'PG',
                      nomor: results.length + 1,
                      pertanyaan: fullQuestion,
                      gambarUrl: imgUrl,
                      svgDiagram: '',
                      pilihan,
                      kunci: 'A',
                      bobot: 10
                    });
                  } else if (qType === 0 || qType === 1) {
                    results.push({
                      id: generateId('SOAL'),
                      mapel,
                      tipe: 'ESSAY',
                      nomor: results.length + 1,
                      pertanyaan: fullQuestion,
                      gambarUrl: imgUrl,
                      svgDiagram: '',
                      pilihan: { A: '', B: '', C: '', D: '', E: '' },
                      kunci: '',
                      bobot: 20
                    });
                  }
                });
              }
            } catch (e) {
              console.warn('FB_PUBLIC_LOAD_DATA_ parse fallback to DOM:', e);
            }
          }
        }
      }

      if (results.length === 0) {
        const parser = new DOMParser();
        const doc = parser.parseFromString(htmlString, 'text/html');
        const questionCards = doc.querySelectorAll('[role="listitem"]');
        questionCards.forEach(card => {
          const headingEl = card.querySelector('[role="heading"]');
          const qTitle = headingEl ? headingEl.textContent.replace(/\*$/, '').trim() : '';
          if (!qTitle || isIdentityFieldQuestion(qTitle)) return;

          const imgEl = card.querySelector('img');
          const imgUrl = imgEl && imgEl.src && imgEl.src.startsWith('http') ? imgEl.src : '';
          const radioOpts = Array.from(card.querySelectorAll('[role="radio"], [role="checkbox"]'))
            .map(el => (el.getAttribute('data-value') || el.getAttribute('aria-label') || el.textContent || '').trim())
            .filter(Boolean);

          if (radioOpts.length >= 2) {
            const letters = ['A', 'B', 'C', 'D', 'E'];
            const pilihan = { A: '', B: '', C: '', D: '', E: '' };
            radioOpts.slice(0, 5).forEach((opt, idx) => { pilihan[letters[idx]] = opt; });
            results.push({
              id: generateId('SOAL'), mapel, tipe: 'PG', nomor: results.length + 1,
              pertanyaan: qTitle, gambarUrl: imgUrl, svgDiagram: '',
              pilihan, kunci: 'A', bobot: 10
            });
          } else {
            results.push({
              id: generateId('SOAL'), mapel, tipe: 'ESSAY', nomor: results.length + 1,
              pertanyaan: qTitle, gambarUrl: imgUrl, svgDiagram: '',
              pilihan: { A: '', B: '', C: '', D: '', E: '' }, kunci: '', bobot: 20
            });
          }
        });
      }

      return results;
    }

    function parseCopiedGoogleFormText(rawText, mapel) {
      const cleaned = rawText
        .replace(/\r/g, '')
        .split('\n')
        .map(line => line.trim())
        .filter(line => line && !/^(Wajib diisi|\*|Tanggapan Anda|Yang lain:|Kirim|Kosongkan formulir|Jangan pernah mengirimkan sandi|Google Formulir|Halaman \d+ dari \d+|Berikutnya|Kembali)$/i.test(line));

      const results = [];
      const noiseBlock = /^(Nama(\s+Lengkap|\s+Siswa)?|Kelas|No\.?\s*(Absen|Peserta)|NISN?|Token|Email)$/i;
      let i = 0;

      while (i < cleaned.length) {
        const line = cleaned[i];
        if (noiseBlock.test(line)) {
          i++;
          continue;
        }

        const optInline = [];
        let j = i + 1;
        while (j < cleaned.length && optInline.length < 5) {
          const nextLine = cleaned[j];
          if (/^\d+[\.\)]\s+/.test(nextLine) || nextLine.endsWith('?') || nextLine.endsWith('...') || nextLine.endsWith('…')) break;
          if (nextLine.length <= 140) {
            optInline.push(nextLine.replace(/^[A-Ea-e][\.\)]\s*/, ''));
            j++;
          } else {
            break;
          }
        }

        const qClean = line.replace(/^\d+[\.\)]\s*/, '').replace(/\s*\*\s*$/, '').trim();
        if (qClean.length >= 4) {
          if (optInline.length >= 2) {
            const letters = ['A', 'B', 'C', 'D', 'E'];
            const pilihan = { A: '', B: '', C: '', D: '', E: '' };
            optInline.forEach((o, idx) => { pilihan[letters[idx]] = o; });
            results.push({
              id: generateId('SOAL'), mapel, tipe: 'PG', nomor: results.length + 1,
              pertanyaan: qClean, gambarUrl: '', svgDiagram: '',
              pilihan, kunci: 'A', bobot: 10
            });
            i = j;
            continue;
          } else if (/^\d+[\.\)]\s+/.test(line) || line.endsWith('?') || line.endsWith('...')) {
            results.push({
              id: generateId('SOAL'), mapel, tipe: 'ESSAY', nomor: results.length + 1,
              pertanyaan: qClean, gambarUrl: '', svgDiagram: '',
              pilihan: { A: '', B: '', C: '', D: '', E: '' }, kunci: '', bobot: 20
            });
          }
        }
        i++;
      }
      return results;
    }

    async function fetchTextWithTimeout(url, timeoutMs = 12000) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), timeoutMs);
      try {
        const res = await fetch(url, { signal: controller.signal });
        clearTimeout(timer);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return await res.text();
      } catch (err) {
        clearTimeout(timer);
        throw err;
      }
    }

    async function handleImportGoogleForm() {
      const rawUrl = document.getElementById('imp-gform-url')?.value.trim();
      const mapel = document.getElementById('imp-mapel').value;
      if (!rawUrl) return showToast('Masukkan link Google Form terlebih dahulu.', 'warning');

      if (!/(docs\.google\.com\/forms|forms\.gle)/i.test(rawUrl)) {
        return showToast('URL tidak dikenali sebagai Google Form (gunakan link docs.google.com/forms atau forms.gle).', 'warning');
      }

      const targetUrl = normalizeGoogleFormUrl(rawUrl);
      showToast('Menghubungi Google Form & mengekstrak butir soal...', 'info');

      const proxyEndpoints = [
        `https://corsproxy.io/?${encodeURIComponent(targetUrl)}`,
        `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(targetUrl)}`,
        `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`
      ];

      let htmlContent = '';
      let isLoginBlocked = false;

      for (const endpoint of proxyEndpoints) {
        try {
          const text = await fetchTextWithTimeout(endpoint, 12000);
          if (text && (text.includes('FB_PUBLIC_LOAD_DATA_') || text.includes('role="listitem"'))) {
            htmlContent = text;
            break;
          }
          if (text && (text.includes('ServiceLogin') || text.includes('accounts.google.com'))) {
            isLoginBlocked = true;
          }
        } catch (e) {}
      }

      if (!htmlContent) {
        if (isLoginBlocked) {
          showToast('Google Form ini dikunci (wajib login akun Google/sekolah). Gunakan tombol "Tempel Soal" di sebelahnya!', 'warning');
        } else {
          showToast('Link Google Form gagal diakses otomatis. Gunakan mode "Tempel Soal" (Ctrl+A lalu Ctrl+C dari halaman Form).', 'warning');
        }
        openGoogleFormPasteModal(targetUrl);
        return;
      }

      const extracted = parseGoogleFormHtmlToQuestions(htmlContent, mapel);
      if (!extracted.length) {
        showToast('Tidak ditemukan butir pertanyaan pada formulir tersebut. Coba gunakan mode "Tempel Soal".', 'warning');
        openGoogleFormPasteModal(targetUrl);
        return;
      }

      importedQuestionsBuffer = extracted;
      document.getElementById('import-preview-container').innerHTML = renderImportPreviewHtml();
      showToast(`Berhasil mengekstrak ${extracted.length} soal dari Google Form! Silakan atur Kunci Jawaban di bawah.`, 'success');
    }

      const jamSelesai = normalizeSheetTimeStr(document.getElementById('jf-selesai').value, '23:59');
      const durasi = Number(document.getElementById('jf-durasi').value) || 60;
      const guruObj = DB.mapel.find(m => m.nama === mapel);

      if (!judul) return showToast('Judul ujian wajib diisi.', 'warning');

      if (editId) {
        const j = DB.jadwal.find(x => x.id === editId);
        if (j) Object.assign(j, { judul, mapel, kelas, tanggal, jamMulai, jamSelesai, durasi, guru: guruObj?.guru || currentUser.name });
      } else {
        DB.jadwal.push({
          id: generateId('JDW'), judul, mapel, kelas, tanggal, jamMulai, jamSelesai, durasi,
          guru: guruObj?.guru || currentUser.name, aktif: true
        });
      }
      saveDatabase();
      closeModal();
      showToast('Jadwal ujian disimpan & disinkronkan!', 'success');
      renderCurrentView();
    }

    function toggleJadwalAktif(id) {
      const j = DB.jadwal.find(x => x.id === id);
      if (j) { j.aktif = !j.aktif; saveDatabase(); renderCurrentView(); }
    }

    function deleteJadwal(id) {
      DB.jadwal = DB.jadwal.filter(x => x.id !== id);
      saveDatabase();
      showToast('Jadwal dihapus.', 'info');
      renderCurrentView();
    }

    /* =========================================================================
       14. MULTI MONITORING UJIAN PER KELAS & FITUR PENGAWAS
       ========================================================================= */
    let selectedMonitorClasses = new Set();
    let monitorLayoutMode = 'grid';
    let monitorStatusFilter = 'ALL';

    function toggleMonitorClass(className) {
      if (className === 'ALL') {
        selectedMonitorClasses.clear();
      } else if (selectedMonitorClasses.has(className)) {
        selectedMonitorClasses.delete(className);
      } else {
        selectedMonitorClasses.add(className);
      }
      renderCurrentView();
    }

    function renderMonitoringView(main) {
      setPageTitle('Multi Monitoring Ujian per Kelas');

      const allClassNames = Array.from(new Set([
        ...DB.kelas.map(k => k.nama),
        ...DB.liveSessions.map(s => s.kelas)
      ])).filter(Boolean);

      const activeClasses = selectedMonitorClasses.size === 0
        ? allClassNames
        : allClassNames.filter(c => selectedMonitorClasses.has(c));

      const filteredSessions = DB.liveSessions.filter(s => {
        const matchClass = activeClasses.includes(s.kelas);
        const matchStatus =
          monitorStatusFilter === 'ALL' ? true :
          monitorStatusFilter === 'ACTIVE' ? s.status === 'Sedang Mengerjakan' :
          monitorStatusFilter === 'LOCKED' ? (s.locked || s.pelanggaran > 0) :
          monitorStatusFilter === 'DONE' ? s.status === 'Selesai' : true;
        return matchClass && matchStatus;
      });

      const sedang = filteredSessions.filter(s => s.status === 'Sedang Mengerjakan').length;
      const terkunci = filteredSessions.filter(s => s.locked).length;
      const selesai = DB.hasilUjian.filter(h => activeClasses.includes(h.kelas)).length;
      const totalSiswaKelas = DB.users.filter(u => u.role === 'siswa' && activeClasses.includes(u.kelas)).length;
      const belum = Math.max(0, totalSiswaKelas - sedang - selesai);

      main.innerHTML = `
        <div class="space-y-5">
          <div class="bg-amber-50 border border-amber-300 rounded-2xl p-4 flex items-start gap-3 text-xs sm:text-sm text-amber-900">
            <i class="fa-solid fa-shield-halved text-amber-600 text-lg mt-0.5 shrink-0"></i>
            <div>
              <strong>Multi Monitoring per Kelas:</strong> Pilih satu atau beberapa kelas di bawah untuk memantau aktivitas pengerjaan secara bersamaan. PIN Buka Kunci Pengawas: <span class="font-mono font-extrabold bg-amber-200 px-2 py-0.5 rounded">${escapeHtml(DB.settings.proctorPin)}</span>

          </div>

          <div class="bg-white rounded-2xl border border-slate-200 p-4 sm:p-5 shadow-sm space-y-4">

              <div>
                <h3 class="font-bold text-navy-900 text-sm sm:text-base">Pilih Kelas yang Dipantau (${selectedMonitorClasses.size === 0 ? 'Semua Kelas' : selectedMonitorClasses.size + ' Kelas Dipilih'})</h3>
                <p class="text-xs text-slate-500">Klik beberapa kelas sekaligus untuk membandingkan progres ujian antar ruang/kelas</p>
              </div>
              <div class="flex flex-wrap items-center gap-2">
                <select onchange="monitorStatusFilter=this.value; renderCurrentView();" class="px-3 py-2 rounded-xl border border-slate-300 text-xs font-bold bg-white">
                  <option value="ALL" ${monitorStatusFilter === 'ALL' ? 'selected' : ''}>Semua Status</option>
                  <option value="ACTIVE" ${monitorStatusFilter === 'ACTIVE' ? 'selected' : ''}>Sedang Mengerjakan</option>
                  <option value="LOCKED" ${monitorStatusFilter === 'LOCKED' ? 'selected' : ''}>Terkunci / Melanggar</option>
                  <option value="DONE" ${monitorStatusFilter === 'DONE' ? 'selected' : ''}>Sudah Selesai</option>
                </select>
                <div class="inline-flex rounded-xl border border-slate-300 p-0.5 bg-slate-100 text-xs font-bold">
                  <button onclick="monitorLayoutMode='grid'; renderCurrentView();" class="px-3 py-1.5 rounded-lg transition ${monitorLayoutMode === 'grid' ? 'bg-navy-900 text-white shadow-sm' : 'text-slate-600 hover:text-navy-900'}">
                    <i class="fa-solid fa-table-cells-large mr-1"></i> Grid per Kelas
                  </button>
                  <button onclick="monitorLayoutMode='table'; renderCurrentView();" class="px-3 py-1.5 rounded-lg transition ${monitorLayoutMode === 'table' ? 'bg-navy-900 text-white shadow-sm' : 'text-slate-600 hover:text-navy-900'}">
                    <i class="fa-solid fa-list mr-1"></i> Tabel Gabungan
                  </button>
                </div>
                <button onclick="renderCurrentView()" class="px-3 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-navy-900 text-xs font-bold" title="Segarkan">
                  <i class="fa-solid fa-rotate"></i>
                </button>
              </div>
            </div>

            <div class="flex flex-wrap gap-2">
              <button onclick="toggleMonitorClass('ALL')"
                class="px-3.5 py-2 rounded-xl text-xs font-bold border transition ${selectedMonitorClasses.size === 0 ? 'bg-electric-600 border-electric-600 text-white shadow-sm' : 'bg-slate-50 border-slate-300 text-slate-700 hover:bg-slate-100'}">
                <i class="fa-solid fa-layer-group mr-1"></i> Semua Kelas (${allClassNames.length})
              </button>
              ${allClassNames.map(cls => {
                const isSelected = selectedMonitorClasses.has(cls);
                const clsActiveCount = DB.liveSessions.filter(s => s.kelas === cls && s.status === 'Sedang Mengerjakan').length;
                const clsLockedCount = DB.liveSessions.filter(s => s.kelas === cls && s.locked).length;
                return `
                  <button onclick="toggleMonitorClass('${escapeHtml(cls)}')"
                    class="px-3.5 py-2 rounded-xl text-xs font-bold border transition flex items-center gap-2 ${isSelected ? 'bg-navy-900 border-navy-900 text-white shadow-sm' : 'bg-white border-slate-300 text-navy-900 hover:border-electric-600'}">
                    <i class="fa-solid ${isSelected ? 'fa-square-check text-electric-400' : 'fa-square text-slate-300'}"></i>
                    <span>Kelas ${escapeHtml(cls)}</span>
                    ${clsActiveCount > 0 ? `<span class="px-1.5 py-0.5 rounded-full text-[10px] bg-blue-500 text-white">${clsActiveCount} aktif</span>` : ''}
                    ${clsLockedCount > 0 ? `<span class="px-1.5 py-0.5 rounded-full text-[10px] bg-red-600 text-white">${clsLockedCount} terkunci</span>` : ''}
                  </button>
                `;
              }).join('')}
            </div>
          </div>

          <!-- 4 Summary Stat Cards -->
          <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
            <div class="bg-white rounded-2xl border border-slate-200 p-4 shadow-sm">
              <div class="text-xs font-bold text-slate-500 uppercase">Sedang Mengerjakan</div>
              <div class="text-2xl font-extrabold text-electric-600 mt-1">${sedang}</div>
            </div>
            <div class="bg-white rounded-2xl border border-slate-200 p-4 shadow-sm">
              <div class="text-xs font-bold text-slate-500 uppercase">Belum Memulai</div>
              <div class="text-2xl font-extrabold text-slate-700 mt-1">${belum}</div>
            </div>
            <div class="bg-white rounded-2xl border border-slate-200 p-4 shadow-sm">
              <div class="text-xs font-bold text-slate-500 uppercase">Sudah Selesai</div>
              <div class="text-2xl font-extrabold text-emerald-600 mt-1">${selesai}</div>
            </div>
            <div class="bg-white rounded-2xl border border-slate-200 p-4 shadow-sm">
              <div class="text-xs font-bold text-slate-500 uppercase">Terkunci / Melanggar</div>
              <div class="text-2xl font-extrabold text-red-600 mt-1">${terkunci}</div>
            </div>
          </div>

          ${monitorLayoutMode === 'grid' ? `
            <div class="grid grid-cols-1 xl:grid-cols-2 gap-5">
              ${activeClasses.map(cls => {
                const classSessions = filteredSessions.filter(s => s.kelas === cls);
                const classSiswaTotal = DB.users.filter(u => u.role === 'siswa' && u.kelas === cls).length;
                const classActiveJadwal = DB.jadwal.find(j => j.kelas === cls && j.aktif);
                const classLockedCount = classSessions.filter(s => s.locked).length;

                return `
                  <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden flex flex-col">
                    <div class="px-5 py-4 bg-navy-900 text-white flex flex-wrap items-center justify-between gap-2">
                      <div>
                        <div class="flex items-center gap-2">
                          <span class="px-2.5 py-0.5 rounded-lg bg-electric-600 text-xs font-extrabold">KELAS ${escapeHtml(cls)}</span>
                          <span class="text-xs text-slate-300">${classSessions.length} sesi / ${classSiswaTotal} siswa</span>
                        </div>
                        <div class="text-xs text-slate-300 mt-1 truncate">
                          ${classActiveJadwal ? `<i class="fa-solid fa-book-open text-electric-400 mr-1"></i> ${escapeHtml(classActiveJadwal.mapel)}` : 'Tidak ada jadwal aktif hari ini'}
                        </div>
                      </div>
                      <div class="flex items-center gap-1.5">
                        ${classLockedCount > 0 ? `
                          <button onclick="proctorUnlockClass('${escapeHtml(cls)}')" class="px-3 py-1.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold">
                            <i class="fa-solid fa-lock-open mr-1"></i> Buka Semua Kunci (${classLockedCount})
                          </button>
                        ` : ''}
                      </div>
                    </div>

                    <div class="p-4 flex-1">
                      ${classSessions.length === 0 ? `
                        <div class="text-center py-8 text-xs text-slate-400">
                          <i class="fa-solid fa-user-clock text-2xl mb-1.5 block"></i>
                          Belum ada sesi aktif pada filter ini untuk kelas ${escapeHtml(cls)}.
                        </div>
                      ` : `
                        <div class="space-y-2.5">
                          ${classSessions.map(s => {
                            const pct = s.totalSoal > 0 ? Math.round((s.terjawab / s.totalSoal) * 100) : 0;
                            return `
                              <div class="p-3.5 rounded-xl border ${s.locked ? 'border-red-300 bg-red-50/60' : 'border-slate-200 bg-slate-50/70'} space-y-2">
                                <div class="flex flex-wrap items-center justify-between gap-2">
                                  <div>
                                    <div class="font-bold text-sm text-navy-900">${escapeHtml(s.namaSiswa)}</div>
                                    <div class="text-[11px] text-slate-500">${escapeHtml(s.mapel)}</div>
                                  </div>
                                  <div class="flex items-center gap-1.5">
                                    <span class="px-2 py-0.5 rounded-full text-[11px] font-bold ${s.locked ? 'bg-red-100 text-red-700' : (s.status === 'Selesai' ? 'bg-emerald-100 text-emerald-700' : 'bg-blue-100 text-electric-700')}">
                                      ${escapeHtml(s.status)}
                                    </span>
                                    <span class="px-2 py-0.5 rounded-lg text-[11px] font-extrabold ${s.pelanggaran >= 3 ? 'bg-red-600 text-white' : (s.pelanggaran > 0 ? 'bg-amber-100 text-amber-800' : 'bg-emerald-100 text-emerald-700')}">
                                      ${s.pelanggaran}x
                                    </span>
                                  </div>
                                </div>

                                <div class="flex items-center gap-3 text-xs">
                                  <div class="flex-1 bg-slate-200 rounded-full h-2 overflow-hidden">
                                    <div class="bg-electric-600 h-2 rounded-full" style="width: ${pct}%"></div>
                                  </div>
                                  <span class="font-bold text-slate-700 whitespace-nowrap">${s.terjawab}/${s.totalSoal} soal</span>
                                  <span class="font-mono font-bold text-navy-900 whitespace-nowrap"><i class="fa-regular fa-clock text-slate-400 mr-1"></i>${formatTimer(s.sisaWaktu)}</span>
                                </div>

                                <div class="flex justify-end gap-1.5 pt-1">
                                  <button onclick="proctorWarn('${s.id}')" class="px-2.5 py-1 rounded-lg bg-amber-100 text-amber-800 hover:bg-amber-200 text-xs font-bold">
                                    <i class="fa-solid fa-bell mr-1"></i> Tegur
                                  </button>
                                  ${s.locked ? `<button onclick="proctorUnlock('${s.id}')" class="px-2.5 py-1 rounded-lg bg-emerald-600 text-white hover:bg-emerald-700 text-xs font-bold"><i class="fa-solid fa-lock-open mr-1"></i> Buka Kunci</button>` : ''}
                                  ${s.status !== 'Selesai' && s.status !== 'Dihentikan Pengawas' ? `<button onclick="proctorStopExam('${s.id}')" class="px-2.5 py-1 rounded-lg bg-red-600 text-white hover:bg-red-700 text-xs font-bold"><i class="fa-solid fa-stop mr-1"></i> Hentikan</button>` : ''}
                                </div>
                              </div>
                            `;
                          }).join('')}
                        </div>
                      `}
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          ` : `
            <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
              <div class="p-5 border-b border-slate-200 flex flex-wrap items-center justify-between gap-3">
                <div>
                  <h3 class="font-bold text-navy-900">Tabel Monitoring Gabungan (${filteredSessions.length} Sesi)</h3>
                  <p class="text-xs text-slate-500">Pembaruan otomatis setiap 5 detik</p>
                </div>
              </div>
              <div class="overflow-x-auto">
                <table class="w-full text-left text-sm">
                  <thead class="bg-slate-50 border-b border-slate-200 text-xs uppercase text-slate-600 font-bold">
                    <tr>
                      <th class="px-4 py-3">Siswa &amp; Kelas</th>
                      <th class="px-4 py-3">Mapel</th>
                      <th class="px-4 py-3">Status</th>
                      <th class="px-4 py-3">Progres</th>
                      <th class="px-4 py-3">Sisa Waktu</th>
                      <th class="px-4 py-3">Pelanggaran</th>
                      <th class="px-4 py-3 text-right">Tindakan Pengawas</th>
                    </tr>
                  </thead>
                  <tbody class="divide-y divide-slate-200">
                    ${filteredSessions.length === 0 ? `<tr><td colspan="7" class="px-4 py-8 text-center text-slate-400">Belum ada sesi ujian aktif pada kelas/filter terpilih.</td></tr>` :
                      filteredSessions.map(s => `
                        <tr class="hover:bg-slate-50">
                          <td class="px-4 py-3">
                            <div class="font-bold text-navy-900">${escapeHtml(s.namaSiswa)}</div>
                            <div class="text-xs text-slate-500">Kelas ${escapeHtml(s.kelas)}</div>
                          </td>
                          <td class="px-4 py-3 text-xs font-semibold text-electric-700">${escapeHtml(s.mapel)}</td>
                          <td class="px-4 py-3">
                            <span class="px-2.5 py-1 rounded-full text-xs font-bold ${s.locked ? 'bg-red-100 text-red-700' : (s.status === 'Selesai' ? 'bg-emerald-100 text-emerald-700' : 'bg-blue-100 text-electric-700')}">
                              ${escapeHtml(s.status)}
                            </span>
                          </td>
                          <td class="px-4 py-3 font-semibold text-xs">${s.terjawab} / ${s.totalSoal} soal</td>
                          <td class="px-4 py-3 font-mono text-xs font-bold">${formatTimer(s.sisaWaktu)}</td>
                          <td class="px-4 py-3">
                            <span class="px-2 py-0.5 rounded-lg text-xs font-extrabold ${s.pelanggaran >= 3 ? 'bg-red-600 text-white' : (s.pelanggaran > 0 ? 'bg-amber-100 text-amber-800' : 'bg-emerald-100 text-emerald-700')}">
                              ${s.pelanggaran}x
                            </span>
                          </td>
                          <td class="px-4 py-3 text-right whitespace-nowrap space-x-1">
                            <button onclick="proctorWarn('${s.id}')" class="px-2.5 py-1.5 rounded-lg bg-amber-100 text-amber-800 hover:bg-amber-200 text-xs font-bold" title="Beri Peringatan"><i class="fa-solid fa-bell"></i></button>
                            ${s.locked ? `<button onclick="proctorUnlock('${s.id}')" class="px-2.5 py-1.5 rounded-lg bg-emerald-600 text-white hover:bg-emerald-700 text-xs font-bold"><i class="fa-solid fa-lock-open mr-1"></i>Buka Kunci</button>` : ''}
                            ${s.status !== 'Selesai' && s.status !== 'Dihentikan Pengawas' ? `<button onclick="proctorStopExam('${s.id}')" class="px-2.5 py-1.5 rounded-lg bg-red-600 text-white hover:bg-red-700 text-xs font-bold" title="Hentikan Ujian"><i class="fa-solid fa-stop"></i></button>` : ''}
                          </td>
                        </tr>
                      `).join('')}
                  </tbody>
                </table>
              </div>
            </div>
          `}
        </div>
      `;

      if (monitoringInterval) clearInterval(monitoringInterval);
      monitoringInterval = setInterval(() => {
        if (currentRoute !== 'monitoring') { clearInterval(monitoringInterval); return; }
        DB.liveSessions.forEach(s => {
          if (s.status === 'Sedang Mengerjakan' && s.sisaWaktu > 0) s.sisaWaktu -= 5;
        });
        renderCurrentView();
      }, 5000);
    }

    function proctorUnlockClass(className) {
      const lockedList = DB.liveSessions.filter(s => s.kelas === className && s.locked);
      if (!lockedList.length) return;
      confirmModal({
        title: `Buka Semua Kunci Kelas ${className}?`,
        message: `Sebanyak <strong>${lockedList.length} siswa</strong> yang terkunci di kelas <strong>${escapeHtml(className)}</strong> akan dibuka kuncinya sekaligus.`,
        confirmText: 'Ya, Buka Semua',
        confirmClass: 'bg-emerald-600 hover:bg-emerald-700 text-white',
        onConfirm: () => {
          lockedList.forEach(s => {
            s.locked = false;
            s.status = 'Sedang Mengerjakan';
            DB.logAktivitas.push({
              id: generateId('LOG'), namaSiswa: s.namaSiswa, kelas: s.kelas, mapel: s.mapel,
              aktivitas: 'Buka Kunci Massal Kelas', jenisPelanggaran: 'Verifikasi Pengawas per Kelas',
              waktu: new Date().toISOString(), jumlahPelanggaran: s.pelanggaran, statusTindakLanjut: 'Kunci Dibuka Pengawas'
            });
          });
          saveDatabase();
          showToast(`Kunci ${lockedList.length} siswa di kelas ${className} telah dibuka!`, 'success');
          renderCurrentView();
        }
      });
    }

    function proctorWarn(sessionId) {
      const s = DB.liveSessions.find(x => x.id === sessionId);
      if (!s) return;
      s.warningMsg = 'Peringatan dari Pengawas: Tetap fokus pada layar ujian!';
      DB.logAktivitas.push({
        id: generateId('LOG'), namaSiswa: s.namaSiswa, kelas: s.kelas, mapel: s.mapel,
        aktivitas: 'Peringatan Pengawas', jenisPelanggaran: 'Teguran Langsung Pengawas',
        waktu: new Date().toISOString(), jumlahPelanggaran: s.pelanggaran, statusTindakLanjut: 'Diberi Peringatan'
      });
      saveDatabase();
      showToast(`Peringatan dikirim ke ${s.namaSiswa}.`, 'warning');
    }

    function proctorUnlock(sessionId) {
      const s = DB.liveSessions.find(x => x.id === sessionId);
      if (!s) return;
      s.locked = false;
      s.status = 'Sedang Mengerjakan';
      DB.logAktivitas.push({
        id: generateId('LOG'), namaSiswa: s.namaSiswa, kelas: s.kelas, mapel: s.mapel,
        aktivitas: 'Buka Kunci Ujian', jenisPelanggaran: 'Verifikasi Pengawas Selesai',
        waktu: new Date().toISOString(), jumlahPelanggaran: s.pelanggaran, statusTindakLanjut: 'Kunci Dibuka Pengawas'
      });
      saveDatabase();
      showToast(`Kunci ujian ${s.namaSiswa} telah dibuka!`, 'success');
      renderCurrentView();
    }

    function proctorStopExam(sessionId) {
      const s = DB.liveSessions.find(x => x.id === sessionId);
      if (!s) return;
      confirmModal({
        title: 'Hentikan Ujian Siswa?',
        message: `Anda akan menghentikan paksa ujian milik <strong>${escapeHtml(s.namaSiswa)}</strong>.`,
        confirmText: 'Hentikan Ujian',
        confirmClass: 'bg-red-600 hover:bg-red-700 text-white',
        onConfirm: () => {
          s.status = 'Dihentikan Pengawas';
          s.locked = true;
          DB.logAktivitas.push({
            id: generateId('LOG'), namaSiswa: s.namaSiswa, kelas: s.kelas, mapel: s.mapel,
            aktivitas: 'Ujian Dihentikan', jenisPelanggaran: 'Penghentian Paksa oleh Pengawas',
            waktu: new Date().toISOString(), jumlahPelanggaran: s.pelanggaran, statusTindakLanjut: 'Ujian Dihentikan'
          });
          saveDatabase();
          showToast(`Ujian ${s.namaSiswa} dihentikan.`, 'error');
          renderCurrentView();
        }
      });
    }

    function renderPesertaPengawasView(main) {
      setPageTitle('Daftar Peserta Ujian');
      const siswa = DB.users.filter(u => u.role === 'siswa');
      main.innerHTML = `
        <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
          <div class="p-5 border-b border-slate-200 font-bold text-navy-900">Daftar Peserta Terdaftar (${siswa.length} Siswa)</div>
          <div class="overflow-x-auto">
            <table class="w-full text-left text-sm">
              <thead class="bg-slate-50 border-b border-slate-200 text-xs uppercase text-slate-600 font-bold">
                <tr><th class="px-4 py-3">No. Peserta</th><th class="px-4 py-3">Nama Siswa</th><th class="px-4 py-3">Kelas</th><th class="px-4 py-3">Status Akun</th></tr>
              </thead>
              <tbody class="divide-y divide-slate-200">
                ${siswa.map(s => `
                  <tr>
                    <td class="px-4 py-3 font-mono text-xs">${escapeHtml(getStudentExamNumber(s))}</td>
                    <td class="px-4 py-3 font-bold text-navy-900">${escapeHtml(s.name)}</td>
                    <td class="px-4 py-3">${escapeHtml(s.kelas || '-')}</td>
                    <td class="px-4 py-3"><span class="px-2 py-0.5 rounded-full text-xs font-bold bg-emerald-100 text-emerald-700">${escapeHtml(s.status)}</span></td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>

        `
      });

    function saveEssayGrades(hasilId) {
      const h = DB.hasilUjian.find(x => x.id === hasilId);
      if (!h) return;
      const questions = DB.bankSoal.filter(q => q.mapel === h.mapel);
      const totalBobot = questions.reduce((acc, q) => acc + (Number(q.bobot) || 10), 0) || 100;
      let earnedEssay = 0;
      h.skorEssayDetail = h.skorEssayDetail || {};

      questions.filter(q => q.tipe === 'ESSAY').forEach(q => {
        const val = Math.min(Number(q.bobot) || 10, Math.max(0, Number(document.getElementById(`essay-score-${q.id}`)?.value || 0)));
        h.skorEssayDetail[q.id] = val;
        earnedEssay += val;
      });

      let earnedPG = 0;
      questions.filter(q => q.tipe === 'PG').forEach(q => {
        if (h.detailJawaban?.[q.id] === q.kunci) earnedPG += (Number(q.bobot) || 10);
      });

      h.nilaiPG = Math.round((earnedPG / totalBobot) * 100);
      h.nilaiEssay = Math.round((earnedEssay / totalBobot) * 100);
      h.nilaiAkhir = Math.min(100, Math.round(((earnedPG + earnedEssay) / totalBobot) * 100));
      h.essayGraded = true;

      saveDatabase();
      closeModal();
      showToast(`Nilai Essay disimpan! Nilai akhir ${h.namaSiswa}: ${h.nilaiAkhir}`, 'success');
      renderCurrentView();
    }

    function exportHasilExcel() {
      if (typeof XLSX === 'undefined') return showToast('SheetJS tidak tersedia.', 'error');

      const ws = XLSX.utils.json_to_sheet(rows);

      XLSX.writeFile(wb, `Hasil_Ujian_${getTodayDateString()}.xlsx`);

    function openGasScriptModal() {
      const gasCode = `// Tempel kode ini di Google Sheets -> Extensions -> Apps Script -> Deploy as Web App (Anyone)
// Mendukung Sinkronisasi Otomatis 2-Arah Real-Time (Guru, Siswa, Soal, Jadwal, Monitoring, Hasil & Pengaturan)
function doGet(e) {
  var action = (e && e.parameter && e.parameter.action) ? e.parameter.action : 'ping';
  var ss = SpreadsheetApp.getActiveSpreadsheet();

  if (action === 'ping') {
    return ContentService.createTextOutput(JSON.stringify({
      status: 'OK',
      spreadsheetName: ss.getName(),
      timestamp: new Date().toISOString()
    })).setMimeType(ContentService.MimeType.JSON);
  }

  if (action === 'pullAll') {
    var out = {};
    var sheetNames = ['DATA_SISWA','DATA_GURU','BANK_SOAL','JADWAL_UJIAN','HASIL_UJIAN','LOG_AKTIVITAS','PENGATURAN_SEKOLAH'];
    sheetNames.forEach(function(name) {
      var sh = ss.getSheetByName(name);
      if (!sh) return;
      var vals = sh.getDataRange().getValues();
      if (vals.length < 2) { out[name] = []; return; }
      var headers = vals[0];
      out[name] = vals.slice(1).map(function(r) {
        var obj = {};
        headers.forEach(function(h, idx) { obj[h] = r[idx]; });
        return obj;
      });
    });
    var cacheJson = PropertiesService.getScriptProperties().getProperty('LIVE_SESSIONS_JSON');
    out.LIVE_SESSIONS = cacheJson ? JSON.parse(cacheJson) : [];
    return ContentService.createTextOutput(JSON.stringify(out)).setMimeType(ContentService.MimeType.JSON);
  }

  // Jika dibuka langsung di browser tanpa parameter action, tampilkan halaman Web App Portal (jika di-host di GAS)
  var htmlFile = HtmlService.createHtmlOutputFromFile('Index');
  htmlFile.setTitle('UJIAN SEKOLAH DIGITAL — Portal CBT Online');
  htmlFile.addMetaTag('viewport', 'width=device-width, initial-scale=1');
  htmlFile.setXFrameOptionsMode(HtmlService.XFrameOptionsMode.ALLOWALL);
  return htmlFile;
}

function doPost(e) {
  var body = JSON.parse(e.postData.contents);
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  if (body.action === 'syncAll' && body.sheets) {
    Object.keys(body.sheets).forEach(function(sheetName) {
      var rows = body.sheets[sheetName];
      var sh = ss.getSheetByName(sheetName) || ss.insertSheet(sheetName);
      sh.clearContents();
      if (!rows || !rows.length) return;
      var headers = Object.keys(rows[0]);
      sh.appendRow(headers);
      sh.getRange(1, 1, 1, headers.length).setFontWeight('bold').setBackground('#0F172A').setFontColor('#FFFFFF');
      var values = rows.map(function(r) {
        return headers.map(function(h) { return r[h] !== undefined ? r[h] : ''; });
      });
      var dataRange = sh.getRange(2, 1, values.length, headers.length);
      dataRange.setNumberFormat('@');
      dataRange.setValues(values);
    });
    if (body.liveSessions) {
      PropertiesService.getScriptProperties().setProperty('LIVE_SESSIONS_JSON', JSON.stringify(body.liveSessions));
    }
  }
  return ContentService.createTextOutput(JSON.stringify({ status: 'SYNCED', timestamp: new Date().toISOString() })).setMimeType(ContentService.MimeType.JSON);
}`;
      window._gasScriptText = gasCode;

    function checkScheduleWindow(j) {
      if (!j.aktif) return { allowed: false, reason: 'Jadwal Nonaktif' };
      const now = new Date();
      const cleanDate = normalizeSheetDateStr(j.tanggal);
      const cleanStart = normalizeSheetTimeStr(j.jamMulai, '00:00');
      const cleanEnd = normalizeSheetTimeStr(j.jamSelesai, '23:59');
      const start = parseLocalDateTime(cleanDate, cleanStart, '00');
      let end = parseLocalDateTime(cleanDate, cleanEnd, '59');
      if (end < start) {
        end = new Date(end.getTime() + 24 * 60 * 60 * 1000);
      }
      if (now < start) return { allowed: false, reason: `Belum Dimulai (${cleanDate} ${cleanStart})` };
      if (now > end) return { allowed: false, reason: `Waktu Berakhir (${cleanDate} ${cleanEnd})` };
      return { allowed: true, reason: 'Sedang Berlangsung' };
    }

    /* =========================================================================
       19. SISTEM UJIAN ANTI-NYONTEK & HALAMAN UJIAN SISWA
       ========================================================================= */
    function confirmStartExam(jadwalId) {
      const j = DB.jadwal.find(x => x.id === jadwalId);
      if (!j) return;
      confirmModal({
        title: 'Mulai Ujian Sekarang?',
        message: `
          <div class="space-y-2 text-sm">
            <p>Anda akan memulai <strong>${escapeHtml(j.judul)}</strong> (${j.durasi} menit).</p>
            <div class="p-3 rounded-xl bg-amber-50 border border-amber-300 text-amber-900 text-xs space-y-1">
              <p><strong>Peraturan Keamanan Anti-Nyontek:</strong></p>
              <ul class="list-disc pl-4 space-y-0.5">
                <li>Layar otomatis masuk mode <strong>Fullscreen</strong>.</li>
                <li>Dilarang pindah tab browser, membuka aplikasi lain, atau keluar fullscreen.</li>
                <li>Setiap pelanggaran dicatat. <strong>3x pelanggaran akan mengunci ujian</strong> hingga diverifikasi Pengawas.</li>
                <li><em>Catatan:</em> Sistem berbasis browser tidak dapat sepenuhnya mencegah HP kedua/screenshot perangkat, namun seluruh aktivitas tercatat untuk diperiksa pengawas.</li>
              </ul>
            </div>
          </div>
        `,
        confirmText: 'Saya Mengerti, Mulai Ujian',
        onConfirm: () => startStudentExam(jadwalId)
      });
    }

    function startStudentExam(jadwalId) {
      const j = DB.jadwal.find(x => x.id === jadwalId);
      if (!j) return;

      if (DB.hasilUjian.some(h => h.jadwalId === jadwalId && h.siswaId === currentUser.id)) {
        showToast('Anda sudah mengumpulkan ujian ini.', 'error');
        return;
      }

      try {
        if (document.documentElement.requestFullscreen) {
          document.documentElement.requestFullscreen().catch(() => {});
        }
      } catch (e) {}

      const rawQuestions = DB.bankSoal.filter(q => q.mapel === j.mapel);
      const shuffledQs = shuffleArray(rawQuestions).map(q => {
        const opts = q.tipe === 'PG'
          ? shuffleArray(['A', 'B', 'C', 'D', 'E'].filter(k => q.pilihan?.[k]).map(k => ({ origKey: k, text: q.pilihan[k] })))
          : [];
        return {
          id: q.id,
          tipe: q.tipe,
          pertanyaan: q.pertanyaan,
          gambarUrl: q.gambarUrl,
          svgDiagram: q.svgDiagram,
          bobot: q.bobot,
          options: opts
        };
      });

      const sessionId = generateId('SES');
      examRuntime = {
        active: true,
        jadwalId: j.id,
        sessionId,
        studentQuestions: shuffledQs,
        answers: {},
        marked: {},
        currentIndex: 0,
        remainingSeconds: j.durasi * 60,
        timerInterval: null,
        violations: 0,
        locked: false,
        startTime: new Date().toISOString()
      };

      DB.liveSessions.push({
        id: sessionId, jadwalId: j.id, siswaId: currentUser.id,
        namaSiswa: currentUser.name, kelas: currentUser.kelas || '-',
        mapel: j.mapel, status: 'Sedang Mengerjakan',
        terjawab: 0, totalSoal: shuffledQs.length, sisaWaktu: j.durasi * 60,
        pelanggaran: 0, locked: false, warningMsg: '', lastPing: new Date().toISOString()
      });
      saveDatabase();

      attachAntiCheatListeners();
      startExamTimer();
      renderExamScreen();
    }

    function startExamTimer() {
      if (examRuntime.timerInterval) clearInterval(examRuntime.timerInterval);
      examRuntime.timerInterval = setInterval(() => {
        if (!examRuntime.active) { clearInterval(examRuntime.timerInterval); return; }
        examRuntime.remainingSeconds--;
        const timerEl = document.getElementById('exam-timer-display');
        if (timerEl) {
          timerEl.textContent = formatTimer(examRuntime.remainingSeconds);
          if (examRuntime.remainingSeconds <= 300) {
            timerEl.classList.add('text-red-400', 'animate-pulse');
          }
        }
        if (examRuntime.remainingSeconds % 10 === 0) {
          const live = DB.liveSessions.find(s => s.id === examRuntime.sessionId);
          if (live) {
            live.sisaWaktu = examRuntime.remainingSeconds;
            live.lastPing = new Date().toISOString();
            saveDatabase(false);
          }
        }
        if (examRuntime.remainingSeconds <= 0) {
          clearInterval(examRuntime.timerInterval);
          submitStudentExam(true, 'Waktu ujian telah habis! Jawaban dikumpulkan otomatis.');
        }
      }, 1000);
    }

    function handleVisibilityChange() {
      if (examRuntime.active && !examRuntime.locked && document.hidden) {
        recordExamViolation('Berpindah Tab Browser / Minimize');
      }
    }
    function handleWindowBlur() {
      if (examRuntime.active && !examRuntime.locked) {
        recordExamViolation('Membuka Aplikasi atau Jendela Lain');
      }
    }
    function handleFullscreenChange() {
      if (examRuntime.active && !examRuntime.locked && !document.fullscreenElement) {
        recordExamViolation('Keluar dari Mode Fullscreen');
      }
    }
    function handleBlockContext(e) {
      if (examRuntime.active) { e.preventDefault(); showToast('Klik kanan dinonaktifkan selama ujian.', 'warning'); }
    }
    function handleBlockCopyKeys(e) {
      if (!examRuntime.active) return;
      if ((e.ctrlKey || e.metaKey) && ['c', 'v', 'x', 'a', 'u', 'p'].includes(e.key.toLowerCase())) {
        e.preventDefault();
        showToast('Pintasan salin/tempel diblokir selama ujian.', 'warning');
      }
    }

    let lastViolationTs = 0;
    function recordExamViolation(reason) {
      const now = Date.now();
      if (now - lastViolationTs < 2500) return;
      lastViolationTs = now;

      examRuntime.violations++;
      const j = DB.jadwal.find(x => x.id === examRuntime.jadwalId);
      const live = DB.liveSessions.find(s => s.id === examRuntime.sessionId);

      if (live) {
        live.pelanggaran = examRuntime.violations;
        if (examRuntime.violations >= 3) {
          live.locked = true;
          live.status = 'Terkunci (Pelanggaran)';
        }
      }

      DB.logAktivitas.push({
        id: generateId('LOG'),
        namaSiswa: currentUser.name,
        kelas: currentUser.kelas || '-',
        mapel: j?.mapel || '-',
        aktivitas: examRuntime.violations >= 3 ? 'Ujian Dikunci Otomatis' : 'Pelanggaran Anti-Nyontek',
        jenisPelanggaran: reason,
        waktu: new Date().toISOString(),
        jumlahPelanggaran: examRuntime.violations,
        statusTindakLanjut: examRuntime.violations >= 3 ? 'Menunggu Verifikasi Pengawas' : 'Peringatan Sistem'
      });
      saveDatabase();

      if (examRuntime.violations >= 3) {
        examRuntime.locked = true;
        showLockScreenModal();
      } else {
        openModal({
          title: `<i class="fa-solid fa-triangle-exclamation text-amber-400"></i> Peringatan Pelanggaran (${examRuntime.violations}/3)`,
          size: 'max-w-md',
          bodyHtml: `
            <div class="space-y-3 text-sm text-slate-700">
              <p>Sistem mendeteksi aktivitas mencurigakan: <strong class="text-red-600">${escapeHtml(reason)}</strong>.</p>
              <p>Pelanggaran ini telah dicatat ke laporan Pengawas. Jika mencapai <strong>3 kali pelanggaran</strong>, layar ujian akan dikunci otomatis.</p>
            </div>
          `,
          footerHtml: `
            <button onclick="resumeFullscreenAndClose()" class="px-5 py-2.5 rounded-xl bg-electric-600 hover:bg-electric-700 text-white text-sm font-bold">Kembali ke Ujian (Fullscreen)</button>
          `
        });
      }
      renderExamScreen();
    }

    function resumeFullscreenAndClose() {
      closeModal();
      try {
        if (!document.fullscreenElement && document.documentElement.requestFullscreen) {
          document.documentElement.requestFullscreen().catch(() => {});
        }
      } catch (e) {}
    }

    function showLockScreenModal() {
      openModal({
        title: `<i class="fa-solid fa-lock text-red-400"></i> UJIAN TERKUNCI SEMENTARA`,
        size: 'max-w-md',
        preventClose: true,
        bodyHtml: `
          <div class="space-y-4 text-center">
            <div class="w-16 h-16 rounded-full bg-red-100 text-red-600 flex items-center justify-center mx-auto">
              <i class="fa-solid fa-shield-exclamation text-3xl"></i>
            </div>
            <p class="text-sm text-slate-700">Anda telah melakukan <strong>${examRuntime.violations}x pelanggaran</strong> keamanan ujian. Panggil Pengawas untuk verifikasi dan membuka kunci layar.</p>
            <div class="text-left">
              <label class="block text-xs font-bold text-slate-600 mb-1">Masukkan PIN Pengawas</label>
              <input id="unlock-pin-input" type="password" placeholder="Masukkan PIN Pengawas..." class="w-full px-4 py-3 rounded-xl border border-slate-300 text-center font-mono text-lg tracking-widest" />
            </div>
            <button onclick="verifyProctorPinUnlock()" class="w-full py-3 rounded-xl bg-navy-900 hover:bg-navy-800 text-white text-sm font-bold">Verifikasi &amp; Buka Kunci</button>
          </div>
        `
      });
    }

    function verifyProctorPinUnlock() {
      const pin = document.getElementById('unlock-pin-input')?.value.trim();
      if (pin === DB.settings.proctorPin) {
        examRuntime.locked = false;
        const live = DB.liveSessions.find(s => s.id === examRuntime.sessionId);
        if (live) { live.locked = false; live.status = 'Sedang Mengerjakan'; }
        saveDatabase();
        resumeFullscreenAndClose();
        showToast('Verifikasi berhasil! Ujian dilanjutkan.', 'success');
      } else {
        showToast('PIN Pengawas salah!', 'error');
      }
    }

    function attachAntiCheatListeners() {
      document.addEventListener('visibilitychange', handleVisibilityChange);
      window.addEventListener('blur', handleWindowBlur);
      document.addEventListener('fullscreenchange', handleFullscreenChange);
      document.addEventListener('contextmenu', handleBlockContext);
      document.addEventListener('keydown', handleBlockCopyKeys);
    }

    function detachAntiCheatListeners() {
      document.removeEventListener('visibilitychange', handleVisibilityChange);
      window.removeEventListener('blur', handleWindowBlur);
      document.removeEventListener('fullscreenchange', handleFullscreenChange);
      document.removeEventListener('contextmenu', handleBlockContext);
      document.removeEventListener('keydown', handleBlockCopyKeys);
    }

    function selectExamAnswer(qId, value) {
      if (examRuntime.locked) return;
      examRuntime.answers[qId] = value;
      const live = DB.liveSessions.find(s => s.id === examRuntime.sessionId);
      if (live) {
        live.terjawab = Object.keys(examRuntime.answers).filter(k => String(examRuntime.answers[k]).trim() !== '').length;
        live.lastPing = new Date().toISOString();
        saveDatabase(false);
      }
      renderExamScreen();
    }

    function toggleMarkQuestion(qId) {
      examRuntime.marked[qId] = !examRuntime.marked[qId];
      renderExamScreen();
    }

    function confirmFinishExam() {
      const total = examRuntime.studentQuestions.length;
      const answered = Object.keys(examRuntime.answers).filter(k => String(examRuntime.answers[k]).trim() !== '').length;
      const unanswered = total - answered;

      confirmModal({
        title: 'Akhiri & Kumpulkan Ujian?',
        message: `
          <div class="space-y-2 text-sm">
            <p>Total Soal: <strong>${total}</strong> &bull; Sudah Dijawab: <strong class="text-emerald-700">${answered}</strong> &bull; Belum Dijawab: <strong class="text-red-600">${unanswered}</strong></p>
            <p class="text-slate-500">Setelah dikumpulkan, Anda tidak dapat mengubah jawaban atau mengerjakan ulang ujian ini.</p>
          </div>
        `,
        confirmText: 'Ya, Kumpulkan Sekarang',
        confirmClass: 'bg-emerald-600 hover:bg-emerald-700 text-white',
        onConfirm: () => submitStudentExam(false)
      });
    }

    function submitStudentExam(autoTriggered = false, customMsg = '') {
      if (!examRuntime.active) return;
      if (examRuntime.timerInterval) clearInterval(examRuntime.timerInterval);
      detachAntiCheatListeners();

      const j = DB.jadwal.find(x => x.id === examRuntime.jadwalId);
      const officialQuestions = DB.bankSoal.filter(q => q.mapel === j.mapel);

      let benar = 0, salah = 0, earnedPG = 0;
      const totalBobot = officialQuestions.reduce((acc, q) => acc + (Number(q.bobot) || 10), 0) || 100;
      const hasEssay = officialQuestions.some(q => q.tipe === 'ESSAY');

      officialQuestions.forEach(q => {
        if (q.tipe === 'PG') {
          const ans = examRuntime.answers[q.id];
          if (ans && ans === q.kunci) {
            benar++;
            earnedPG += (Number(q.bobot) || 10);
          } else {
            salah++;
          }
        }
      });

      const nilaiPG = Math.round((earnedPG / totalBobot) * 100);

      if (!DB.hasilUjian.some(h => h.jadwalId === j.id && h.siswaId === currentUser.id)) {
        DB.hasilUjian.push({
          id: generateId('HSL'),
          jadwalId: j.id,
          siswaId: currentUser.id,
          namaSiswa: currentUser.name,
          kelas: currentUser.kelas || '-',
          mapel: j.mapel,
          jumlahSoal: officialQuestions.length,
          benar,
          salah,
          nilaiPG,
          nilaiEssay: 0,
          nilaiAkhir: nilaiPG,
          essayGraded: !hasEssay,
          waktuMulai: examRuntime.startTime,
          waktuSelesai: new Date().toISOString(),
          detailJawaban: { ...examRuntime.answers },
          skorEssayDetail: {}
        });
      }

      const live = DB.liveSessions.find(s => s.id === examRuntime.sessionId);
      if (live) {
        live.status = 'Selesai';
        live.locked = false;
        live.sisaWaktu = 0;
      }

      examRuntime.active = false;
      saveDatabase();

      try {
        if (document.fullscreenElement && document.exitFullscreen) {
          document.exitFullscreen().catch(() => {});
        }
      } catch (e) {}

      closeModal();
      showToast(customMsg || 'Ujian berhasil dikumpulkan dan tersimpan otomatis!', 'success');
      currentRoute = 'siswa_riwayat';
      renderApp();
    }

                  <button onclick="toggleMarkQuestion('${q.id}')"
                    class="px-3 py-1.5 rounded-xl text-xs font-bold border transition ${examRuntime.marked[q.id] ? 'bg-amber-400 border-amber-500 text-slate-950' : 'bg-slate-50 border-slate-300 text-slate-700 hover:bg-amber-50'}">
                    <i class="fa-solid fa-flag mr-1"></i> ${examRuntime.marked[q.id] ? 'Ditandai Ragu-Ragu' : 'Tandai Soal'}
                  </button>
                </div>

                <!-- Question Text & Image -->
                <div class="space-y-4 mb-6">
                  <p class="text-base sm:text-lg text-navy-900 font-medium leading-relaxed">${escapeHtml(q.pertanyaan)}</p>
                  ${q.gambarUrl ? `<img src="${q.gambarUrl}" alt="Ilustrasi Soal" class="max-h-72 rounded-xl border border-slate-200 shadow-sm" />` : ''}
                  ${q.svgDiagram ? `<div>${q.svgDiagram}</div>` : ''}
                </div>

                <!-- Options or Essay Box -->
                ${q.tipe === 'PG' ? `
                  <div class="space-y-3">
                    ${q.options.map((opt, idx) => {
                      const selected = examRuntime.answers[q.id] === opt.origKey;
                      return `
                        <button type="button" onclick="selectExamAnswer('${q.id}', '${opt.origKey}')"
                          class="w-full text-left p-4 rounded-xl border-2 transition flex items-start gap-3 ${selected ? 'border-electric-600 bg-blue-50 text-navy-900 shadow-sm' : 'border-slate-200 hover:border-slate-300 bg-white text-slate-700'}">
                          <span class="w-7 h-7 rounded-lg font-extrabold text-xs flex items-center justify-center shrink-0 ${selected ? 'bg-electric-600 text-white' : 'bg-slate-100 text-slate-700'}">${letters[idx]}</span>
                          <span class="text-sm sm:text-base font-medium leading-snug pt-0.5">${escapeHtml(opt.text)}</span>
                        </button>
                      `;
                    }).join('')}
                  </div>
                ` : `
                  <div>
                    <label class="block text-xs font-bold uppercase text-slate-500 mb-2">Jawaban Uraian / Essay (Tersimpan Otomatis):</label>
                    <textarea rows="6" oninput="selectExamAnswer('${q.id}', this.value)" placeholder="Ketik jawaban Anda dengan jelas di sini..."
                      class="w-full p-4 rounded-xl border-2 border-slate-300 focus:border-electric-600 outline-none text-sm sm:text-base">${escapeHtml(examRuntime.answers[q.id] || '')}</textarea>
                  </div>
                `}
              </div>

              <!-- Prev / Next Controls -->
              <div class="mt-8 pt-5 border-t border-slate-200 flex flex-wrap items-center justify-between gap-3">
                <button onclick="examRuntime.currentIndex = Math.max(0, examRuntime.currentIndex - 1); renderExamScreen();"
                  ${examRuntime.currentIndex === 0 ? 'disabled' : ''}
                  class="px-5 py-2.5 rounded-xl border border-slate-300 text-navy-900 font-bold text-sm hover:bg-slate-100 disabled:opacity-40 transition">
                  <i class="fa-solid fa-arrow-left mr-1"></i> Sebelumnya
                </button>

                ${examRuntime.currentIndex < total - 1 ? `
                  <button onclick="examRuntime.currentIndex++; renderExamScreen();"
                    class="px-6 py-2.5 rounded-xl bg-electric-600 hover:bg-electric-700 text-white font-bold text-sm shadow-sm transition">
                    Selanjutnya <i class="fa-solid fa-arrow-right ml-1"></i>
                  </button>
                ` : `
                  <button onclick="confirmFinishExam()"
                    class="px-6 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-sm shadow-sm transition">
                    <i class="fa-solid fa-paper-plane mr-1"></i> Selesai Ujian
                  </button>
                `}
              </div>
            </div>

            <!-- Question Navigation Panel -->
            <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-5 flex flex-col justify-between h-fit">
              <div>
                <h3 class="font-bold text-navy-900 text-sm mb-3">Navigasi Nomor Soal</h3>
                <div class="grid grid-cols-5 gap-2 mb-5">
                  ${examRuntime.studentQuestions.map((item, idx) => {
                    const isCurrent = idx === examRuntime.currentIndex;
                    const isMarked = !!examRuntime.marked[item.id];
                    const isAnswered = examRuntime.answers[item.id] && String(examRuntime.answers[item.id]).trim() !== '';

                    let btnClass = 'bg-red-500 text-white border-red-600';
                    if (isMarked) btnClass = 'bg-amber-400 text-slate-950 border-amber-500';
                    else if (isAnswered) btnClass = 'bg-emerald-600 text-white border-emerald-700';

                    return `
                      <button onclick="examRuntime.currentIndex=${idx}; renderExamScreen();"
                        class="h-10 rounded-xl font-extrabold text-xs border transition ${btnClass} ${isCurrent ? 'ring-2 ring-offset-2 ring-navy-900 scale-105' : ''}">
                        ${idx + 1}
                      </button>
                    `;
                  }).join('')}
                </div>

                <!-- Color Legend -->
                <div class="space-y-2 text-xs text-slate-600 border-t border-slate-200 pt-4 mb-5">
                  <div class="flex items-center gap-2"><span class="w-4 h-4 rounded bg-emerald-600 inline-block"></span> Hijau: Sudah dijawab</div>
                  <div class="flex items-center gap-2"><span class="w-4 h-4 rounded bg-red-500 inline-block"></span> Merah: Belum dijawab</div>
                  <div class="flex items-center gap-2"><span class="w-4 h-4 rounded bg-amber-400 inline-block"></span> Kuning: Ditandai untuk ditinjau</div>
                </div>
              </div>

              <button onclick="confirmFinishExam()" class="w-full py-3 rounded-xl bg-navy-900 hover:bg-navy-800 text-white text-sm font-bold shadow-sm transition">
                <i class="fa-solid fa-check-double mr-1"></i> Selesai &amp; Kumpulkan
              </button>
            </div>
          </div>
        </div>
      `;

      if (examRuntime.locked) showLockScreenModal();
    }

    /* =========================================================================
       20. PANDUAN PENGGUNAAN (ADMIN, GURU, PENGAWAS, SISWA)
       ========================================================================= */
    function renderPanduanView(main) {
      setPageTitle('Panduan Penggunaan Aplikasi');
      main.innerHTML = `
        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
          <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm">
            <h3 class="font-bold text-navy-900 mb-2"><i class="fa-solid fa-user-shield text-electric-600 mr-2"></i>Panduan Admin</h3>
            <ul class="list-disc pl-5 text-xs sm:text-sm text-slate-600 space-y-1.5">
              <li>Kelola akun Siswa, Guru, dan Pengawas melalui menu <strong>Data Siswa</strong> &amp; <strong>Data Guru</strong>.</li>
              <li>Atur nama sekolah, logo, dan PIN Pengawas pada menu <strong>Pengaturan &amp; Backup</strong>.</li>
              <li>Hubungkan ke Google Sheets di menu <strong>Sinkronisasi Sheets</strong> dengan menyalin template <code>Code.gs</code>.</li>
              <li>Lakukan backup rutin database JSON sebelum dan sesudah pelaksanaan ujian.</li>
            </ul>
          </div>
          <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm">
            <h3 class="font-bold text-navy-900 mb-2"><i class="fa-solid fa-chalkboard-user text-emerald-600 mr-2"></i>Panduan Guru</h3>
            <ul class="list-disc pl-5 text-xs sm:text-sm text-slate-600 space-y-1.5">
              <li>Unduh template resmi Excel di menu <strong>Import Soal</strong> atau langsung upload file Word (<code>.docx</code>) bergambar.</li>
              <li>Gunakan fitur <strong>Hapus Bank Soal</strong> di menu Bank Soal untuk menghapus soal terpilih, per mata pelajaran, atau mengosongkan seluruh bank soal.</li>
              <li>Nilai soal Essay siswa di menu <strong>Hasil Ujian &rarr; Detail / Nilai</strong>, lalu unduh rekap Excel atau PDF.</li>
            </ul>
          </div>
          <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm">
            <h3 class="font-bold text-navy-900 mb-2"><i class="fa-solid fa-eye text-amber-600 mr-2"></i>Panduan Pengawas</h3>
            <ul class="list-disc pl-5 text-xs sm:text-sm text-slate-600 space-y-1.5">
              <li>Pantau status pengerjaan &amp; pelanggaran peserta secara langsung di <strong>Monitoring Real-Time</strong>.</li>
              <li>Jika siswa terkunci akibat 3x pelanggaran, verifikasi kondisi siswa lalu klik <strong>Buka Kunci</strong> atau masukkan PIN Pengawas di layar siswa.</li>
              <li>Catat seluruh kejadian penting selama ujian pada menu <strong>Berita Acara Ujian</strong>.</li>
            </ul>
          </div>
          <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm">
            <h3 class="font-bold text-navy-900 mb-2"><i class="fa-solid fa-user-graduate text-indigo-600 mr-2"></i>Panduan Siswa</h3>
            <ul class="list-disc pl-5 text-xs sm:text-sm text-slate-600 space-y-1.5">
              <li>Login menggunakan username &amp; password yang diberikan sekolah, lalu pilih jadwal aktif.</li>
              <li>Jangan keluar dari layar penuh, berpindah tab, atau membuka aplikasi lain saat ujian berlangsung.</li>
              <li>Gunakan indikator warna navigasi (Hijau = terjawab, Merah = belum, Kuning = ragu-ragu) sebelum menekan <strong>Selesai Ujian</strong>.</li>
            </ul>
          </div>
        </div>
      `;
    }

    /* =========================================================================
       21. APPLICATION BOOTSTRAP
       ========================================================================= */
    async function initApp() {
      await loadDatabase();
      const savedSession = sessionStorage.getItem(SESSION_KEY);
      if (savedSession) {
        try {
          const { id } = JSON.parse(savedSession);
          const found = DB.users.find(u => u.id === id);
          if (found) {
            currentUser = found;
            if (found.role === 'pengawas') currentRoute = 'monitoring';
            else if (found.role === 'siswa') currentRoute = 'siswa_dashboard';
            else currentRoute = 'dashboard';
          }
        } catch {}
      }
      renderApp();
    }

    window.addEventListener('DOMContentLoaded', initApp);
  </script>
</body>
</html>
